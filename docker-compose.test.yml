# Disposable PostgreSQL for running the test suites.
#
#   docker compose -f docker-compose.test.yml up -d
#   DATABASE_URL=postgresql://champ_test:champ_test@127.0.0.1:55432/champ_test ./scripts/verify.sh
#   docker compose -f docker-compose.test.yml down -v
#
# Port 55432 is used so this never collides with a real PostgreSQL on 5432.
# The data directory is tmpfs, so the database is discarded with the container
# and can never accumulate state between runs.
#
# Adapted from the disposable-database harness in CHAMP-WORD-COMPLETE-FULL-GAME.zip.
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: champ_test
      POSTGRES_PASSWORD: champ_test
      POSTGRES_DB: champ_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U champ_test -d champ_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
