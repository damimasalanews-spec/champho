 <radialGradient id="moonGlow"><stop stop-color="#eaf6ff" stop-opacity=".9"/><stop offset=".22" stop-color="#a8d5ff" stop-opacity=".42"/><stop offset="1" stop-color="#5e9fff" stop-opacity="0"/></radialGradient>
 <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b8d7ff"/><stop offset=".22" stop-color="#5279bd"/><stop offset="1" stop-color="#172d68"/></linearGradient>
 <linearGradient id="castle" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e0dfff"/><stop offset=".3" stop-color="#778bc7"/><stop offset="1" stop-color="#27376f"/></linearGradient>
 <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#243d87"/><stop offset="1" stop-color="#07183f"/></linearGradient>
