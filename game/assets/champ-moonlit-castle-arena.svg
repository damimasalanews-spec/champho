 <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a4d7ff" stop-opacity=".48"/><stop offset="1" stop-color="#1d3f86" stop-opacity=".05"/></linearGradient>
 <radialGradient id="vignette"><stop offset=".55" stop-color="#06133b" stop-opacity="0"/><stop offset="1" stop-color="#020922" stop-opacity=".62"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="glowSoft"><feGaussianBlur stdDeviation="15"/></filter>
