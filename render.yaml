# Render Blueprint — CHAMP WORD (authoritative classic redesign).
#
# WHY THIS FILE EXISTS
# The project previously had NO deployment configuration at all, which is how the
# frontend and backend drifted onto two separate services and stopped talking to
# each other. The running service — https://champword-classic.onrender.com — uses
# the values below. Because the service name matches an existing service, a
# Blueprint apply adopts and reconfigures that service rather than creating a
# duplicate.
#
# ---------------------------------------------------------------------------
# READ THIS BEFORE RUNNING A BLUEPRINT APPLY
#
# The database is deliberately NOT declared here.
#
# Render permits only ONE free Postgres database per workspace, and this workspace
# already has one: `champword-db`, region oregon. A Blueprint that declares a
# second free database is rejected, so DATABASE_URL is set by hand (`sync: false`
# below, which prompts for it in the dashboard) from:
#
#   Dashboard -> champword-db -> Connect -> Internal connection string
#
# Reusing that database is safe rather than merely expedient: migrations 001-004
# are byte identical between this branch and the branch the older backend runs,
# and this branch only adds 005 and 006 on top. The migration ledger keys on
# version and takes an advisory lock, so applying it there is additive.
#
# The service MUST be in the database's region (oregon). The internal connection
# string does not route cross-region, and a free web service reaching a database
# over the public internet risks suspension under Render's
# service-initiated-traffic policy.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: champword-classic
    runtime: node
    plan: free
    region: oregon
    branch: redesign/authoritative-classic

    # `--include=dev` is load-bearing, not decoration. `typescript`, `@types/node`
    # and `@types/pg` are devDependencies, and NODE_ENV=production below makes npm
    # omit them. Without the flag the build installs 16 packages, compiles with no
    # Node typings, and dies with 73 errors: "Cannot find name 'process'",
    # "Cannot find name 'Buffer'", "Could not find a declaration file for module
    # 'pg'". That failure is invisible locally, where devDependencies are present.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start

    # This must be a WEB SERVICE, not a Static Site. The game needs a long-lived
    # Node process for WebSockets, and it serves the client from the same origin so
    # the client cannot be pointed at the wrong host. /health returning JSON is
    # also how a Static Site misdeployment is detected: a static host answers 404
    # there.
    healthCheckPath: /health

    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # Generated once by Render and stable across deploys. Without it the server
      # falls back to a per-process secret, so every restart invalidates every
      # player's session. (The older backend service is missing this.)
      - key: SESSION_SECRET
        generateValue: true

      # Set by hand — see the note at the top of this file.
      - key: DATABASE_URL
        sync: false
