<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Champ Word Go Wild</title>
    <!-- This page's sheet came in as game/wild-arcade.css rather than replacing
         game/styles.css, because game/styles.css is shared: game/index.html
         (Classic) and game/emotes.html both load it, and overwriting it with this
         page's sheet would strip Classic of its styling. game/sound.js stays
         shared as-is — the one function this page needs that it lacked,
         playTimerTickSound, was added to it instead. -->
    <link rel="stylesheet" href="game/wild-arcade.css">
</head>
<body>

    <!-- Full Screen Graphic Effects Layer -->
    <div id="screen-effects" class="screen-effect-layer"></div>

    <div class="game-table">

        <!-- Match clock: top left, counting down MM:SS -->
        <div class="arcade-timer-badge">
            <span class="clock-glyph" aria-hidden="true">⏱️</span>
            <span id="game-countdown-string">02:29</span>
        </div>

        <!-- Live Neon Turn Indicator Rig -->
        <div class="floating-turn-ring">
            <div class="direction-arrow arrow-top" id="arrow-opponent-top"></div>
            <div class="direction-arrow arrow-right" id="arrow-opponent-right"></div>
            <div class="direction-arrow arrow-bottom" id="arrow-local-player"></div>
            <div class="direction-arrow arrow-left" id="arrow-opponent-left"></div>
        </div>

        <!-- Central Deck Field Space -->
        <div class="center-play-zone" id="center-board-zone">
            <div class="draw-deck-source" id="central-deck"></div>
            <div class="discard-pile" id="discard-deck-pile"></div>
        </div>

        <!-- Peripheral Seating Layout Slots -->
        <div class="player-slot opponent-left" id="slot-opponent-left">
            <div class="opponent-profile-wrapper">
                <div class="avatar-container">👩</div>
                <div class="player-name-tag">Kalkal</div>
                <div class="opponent-card-count-stack" id="count-stack-opponent-left"></div>
            </div>
        </div>

        <div class="player-slot opponent-top" id="slot-opponent-top">
            <div class="opponent-profile-wrapper">
                <div class="avatar-container">👩‍🦰</div>
                <div class="player-name-tag">Poker</div>
                <div class="opponent-card-count-stack" id="count-stack-opponent-top"></div>
            </div>
        </div>

        <div class="player-slot opponent-right" id="slot-opponent-right">
            <div class="opponent-profile-wrapper">
                <div class="avatar-container">👨</div>
                <div class="player-name-tag">Jess</div>
                <div class="opponent-card-count-stack" id="count-stack-opponent-right"></div>
            </div>
        </div>

        <!-- Local Interactive Player Base Container -->
        <div class="hand-container" id="local-player-hand"></div>

        <!-- Control Action Panel -->
        <div class="controls-panel">
            <button class="btn-arcade" id="btn-uno-call">UNO</button>
        </div>

        <!-- Chat. Local only: this page has no socket, so these float up and play a
             note instead of reaching anyone. The networked page is the one that
             actually sends a message. -->
        <!-- One tray, two groups: the canned messages above, the emoji that were
             already on this page below. -->
        <div class="chat-picker-tray" id="chat-selection-tray">
            <div class="chat-option-node" data-msg="Hello! 👋" role="button" tabindex="0">Hello! 👋</div>
            <div class="chat-option-node" data-msg="Good Game! 🌟" role="button" tabindex="0">Good Game! 🌟</div>
            <div class="chat-option-node" data-msg="Oops! 🙈" role="button" tabindex="0">Oops! 🙈</div>
            <div class="chat-option-node" data-msg="Hurry Up! ⏱️" role="button" tabindex="0">Hurry Up! ⏱️</div>
            <div class="chat-emoji-row">
                <button type="button">😀</button>
                <button type="button">😂</button>
                <button type="button">😮</button>
                <button type="button">😎</button>
                <button type="button">🔥</button>
                <button type="button">👏</button>
                <button type="button">😭</button>
                <button type="button">🎉</button>
            </div>
        </div>
        <div class="chat-bubble-trigger" id="chat-trigger" role="button" tabindex="0" aria-label="Chat">💬</div>
    </div>

    <!-- The wild colour wheel. Deliberately OUTSIDE .game-table: the table carries
         perspective, and a perspective ancestor becomes the containing block for a
         fixed-position child, which would anchor this overlay to the table rather
         than to the viewport. -->
    <div id="wild-color-picker" class="color-picker-overlay">
        <div class="color-wheel-rig" role="group" aria-label="Choose a colour">
            <div class="color-quadrant quad-red" data-color="RED" role="button" tabindex="0" aria-label="Red"></div>
            <div class="color-quadrant quad-blue" data-color="BLUE" role="button" tabindex="0" aria-label="Blue"></div>
            <div class="color-quadrant quad-yellow" data-color="YELLOW" role="button" tabindex="0" aria-label="Yellow"></div>
            <div class="color-quadrant quad-green" data-color="GREEN" role="button" tabindex="0" aria-label="Green"></div>
        </div>
    </div>

    <!-- The "UNO!" callout. Always present, never clickable (the overlay is
         pointer-events:none), and empty of geometry until it is given a class.
         Outside .game-table for the same reason as the wheel: the table's
         perspective would become this fixed element's containing block. -->
    <div id="uno-callout-overlay" class="uno-announcement-overlay">
        <div id="uno-banner-card" class="uno-announcement-banner">
            <h1 class="uno-announcement-text">UNO!</h1>
            <div id="uno-banner-subtext" class="uno-announcement-subtext">Champ called UNO!</div>
        </div>
    </div>

    <!-- The round victory screen. Opens when the local hand empties, which is the
         only thing in this page that ends a round. -->
    <div id="victory-screen-modal" class="victory-screen-backdrop">
        <div class="victory-card-rig">
            <h2 class="victory-header-text">ROUND OVER</h2>
            <div class="victory-winner-callout">
                <span id="winner-name-string">Champ</span> wins the round!
                <div class="points-badge-pop">+<span id="round-points-value">0</span> Points</div>
            </div>
            <div class="leaderboard-list-box" id="leaderboard-rows-box"></div>
            <button class="arcade-next-btn" id="next-round-ready-trigger">READY FOR NEXT ROUND</button>
        </div>
    </div>

    <!-- Script Execution Pipelines -->
    <script src="game/sound.js"></script>
    <script>
        'use strict';

        // Mock WebSocket structural engine variables for runtime simulation testing
        let activeTimerInterval = null;
        const localHandMock = [
            { id: 101, color: 'red', value: '1' },
            { id: 102, color: 'blue', value: '5' },
            { id: 103, color: 'yellow', value: '9' },
            { id: 104, color: 'green', value: 'W' }
        ];
        
        // The victory screen needs two numbers per seat that the deal did not: what the
        // seat has scored so far, and what the cards still in its hand are worth. The
        // second is the one the server computes with scoreHand() — the winner of a round
        // is paid the value of everybody else's remaining hand — so the mock carries the
        // same two facts rather than a formula of its own.
        const playersMock = [
            { id: 'p_left', name: 'Kalkal', tableSlotPosition: 'opponent-left', score: 320, handPoints: 34 },
            { id: 'p_top', name: 'Poker', tableSlotPosition: 'opponent-top', score: 245, handPoints: 21 },
            { id: 'p_right', name: 'Jess', tableSlotPosition: 'opponent-right', score: 190, handPoints: 47 },
            { id: 'p_local', name: 'Champ', tableSlotPosition: 'local-player', score: 417, handPoints: 0 }
        ];

        // Trigger visual effect flashes securely
        function triggerScreenFlash(effectClass) {
            const effectNode = document.getElementById('screen-effects');
            if (!effectNode) return;
            effectNode.className = 'screen-effect-layer';
            void effectNode.offsetWidth; // Force hardware redraw reflow repaint
            effectNode.classList.add(effectClass);
        }

        // Render Arched Player Hand UI dynamically with math variables
        function renderHand(cardsArray) {
            const handContainer = document.getElementById('local-player-hand');
            if (!handContainer) return;
            handContainer.innerHTML = '';

            const totalCards = cardsArray.length;
            const midIndex = (totalCards - 1) / 2;

            cardsArray.forEach((card, i) => {
                const cardEl = document.createElement('div');
                cardEl.classList.add('card', card.color);
                
                // Add inner text nodes
                const valueEl = document.createElement('span');
                valueEl.classList.add('card-value');
                valueEl.innerText = card.value;
                cardEl.appendChild(valueEl);

                // Add secondary design markers
                const leftCorner = document.createElement('div');
                leftCorner.classList.add('corner-value', 'corner-top-left');
                leftCorner.innerText = card.value;
                cardEl.appendChild(leftCorner);

                const rightCorner = document.createElement('div');
                rightCorner.classList.add('corner-value', 'corner-bottom-right');
                rightCorner.innerText = card.value;
                cardEl.appendChild(rightCorner);

                // Arc layouts calculations
                const offsetFromMiddle = i - midIndex;
                const rotationAngle = offsetFromMiddle * 5;
                const verticalDip = Math.abs(offsetFromMiddle) * 4;

                cardEl.style.setProperty('--index-offset', offsetFromMiddle);
                cardEl.style.setProperty('--arc-rotation', `${rotationAngle}deg`);
                cardEl.style.setProperty('--arc-y', `${verticalDip}px`);
                cardEl.style.setProperty('--card-index', i);

                // Add audio triggers natively
                cardEl.addEventListener('mouseenter', () => {
                    playCardRuffleSound();
                });

                cardEl.addEventListener('click', () => {
                    playCardSlamSound();
                    executeLocalCardPlay(card, cardEl);
                });

                handContainer.appendChild(cardEl);
            });
        }

        // Simulates localized card play animations moving toward discard pile
        function executeLocalCardPlay(cardData, cardElement) {
            const discardPile = document.getElementById('discard-deck-pile');
            const centerZone = document.getElementById('center-board-zone');
            if (!discardPile || !centerZone) return;

            // Generate realistic chaotic positioning values for table messiness
            const randomRot = (Math.random() * 24) - 12;
            const randomX = (Math.random() * 10) - 5;
            const randomY = (Math.random() * 10) - 5;

            const placedCard = document.createElement('div');
            placedCard.classList.add('discarded-card', cardData.color);
            placedCard.style.setProperty('--discard-rot', `${randomRot}deg`);
            placedCard.style.setProperty('--discard-x', `${randomX}px`);
            placedCard.style.setProperty('--discard-y', `${randomY}px`);
            placedCard.style.setProperty('--discard-z', `${discardPile.children.length * 2}px`);

            const valueEl = document.createElement('span');
            valueEl.classList.add('card-value');
            valueEl.innerText = cardData.value;
            placedCard.appendChild(valueEl);

            discardPile.appendChild(placedCard);

            // Trigger physical slam camera bounce
            centerZone.classList.add('impact');
            setTimeout(() => centerZone.classList.remove('impact'), 130);

            // Execute corresponding effect layer triggers based on card rules
            if (cardData.value === 'W') {
                playWildCardSound();
                triggerScreenFlash('effect-wild');
                // A wild has no colour of its own. Hold the card that has just landed
                // so the wheel can colour it, then open the wheel.
                awaitingWildCard = placedCard;
                presentColorPickerWheel();
            } else if (cardData.value === 'S') {
                playSkipCardSound();
                triggerScreenFlash('effect-skip');
            }

            // Remove item from active collection and repaint
            cardElement.remove();

            // An empty hand ends the round, and the round is what the victory screen is
            // for. Checked after the removal, not before, so the last card counts.
            if (!document.querySelectorAll('.hand-container .card').length) {
                finishRoundLocally();
            }
        }

        // Updates red stack counter widgets for opponent seating boundaries
        function updateOpponentCounters(slotKey, countNumber) {
            const targetStack = document.getElementById(`count-stack-${slotKey}`);
            if (!targetStack) return;
            targetStack.innerHTML = '';

            const countStr = countNumber.toString();
            for (let char of countStr) {
                const miniCard = document.createElement('div');
                miniCard.classList.add('mini-counter-card');
                miniCard.innerText = char;
                targetStack.appendChild(miniCard);
            }
        }

        // Activates the neon direction arrow tracing system around game board
        function highlightTurnIndicator(activeSlotKey) {
            document.querySelectorAll('.direction-arrow').forEach(arrow => {
                arrow.classList.remove('active-turn');
            });
            const targetArrow = document.getElementById(`arrow-${activeSlotKey}`);
            if (targetArrow) {
                targetArrow.classList.add('active-turn');
            }
        }

        // Cinematic 3D Round Deal Animation matrix sequence loops
        function initializeCinematic3DDeal(playersList, finalHandData) {
            const tableCanvas = document.querySelector('.game-table');
            const deckAnchor = document.getElementById('central-deck');
            if (!deckAnchor || !tableCanvas) return;

            const deckBounds = deckAnchor.getBoundingClientRect();
            const deckX = deckBounds.left + deckBounds.width / 2;
            const deckY = deckBounds.top + deckBounds.height / 2;

            const seatingMap = {
                'opponent-left': document.getElementById('slot-opponent-left'),
                'opponent-top': document.getElementById('slot-opponent-top'),
                'opponent-right': document.getElementById('slot-opponent-right'),
                'local-player': document.getElementById('local-player-hand')
            };

            const fullDealPipeline = [];
            const cardsPerHand = 7;

            for (let round = 0; round < cardsPerHand; round++) {
                playersList.forEach(p => {
                    fullDealPipeline.push({ playerId: p.id, positionKey: p.tableSlotPosition });
                });
            }

            const frameIntervalRate = 220; // Paced deployment rate for legibility

            fullDealPipeline.forEach((task, index) => {
                setTimeout(() => {
                    const targetElement = seatingMap[task.positionKey];
                    if (!targetElement) return;

                    const destBounds = targetElement.getBoundingClientRect();
                    const targetX = destBounds.left + destBounds.width / 2;
                    const targetY = destBounds.top + destBounds.height / 2;

                    const flightCard = document.createElement('div');
                    flightCard.classList.add('card-in-flight');
                    flightCard.style.setProperty('--deck-x', `${deckX}px`);
                    flightCard.style.setProperty('--deck-y', `${deckY}px`);

                    // Generate random mid-air 3D rotation angles
                    const rotX = (Math.random() * 40) - 20;
                    const rotY = (Math.random() * 60) - 30;
                    const rotZ = (Math.random() * 40) - 20;

                    flightCard.style.setProperty('--target-x', `${targetX}px`);
                    flightCard.style.setProperty('--target-y', `${targetY}px`);
                    flightCard.style.setProperty('--target-z', '150px');
                    flightCard.style.setProperty('--rot-x', `${rotX}deg`);
                    flightCard.style.setProperty('--rot-y', `${rotY}deg`);
                    flightCard.style.setProperty('--rot-z', `${rotZ}deg`);

                    tableCanvas.appendChild(flightCard);

                    requestAnimationFrame(() => {
                        flightCard.classList.add('thrown');
                    });

                    playCardRuffleSound();

                    setTimeout(() => {
                        flightCard.remove();
                    }, 560);

                }, index * frameIntervalRate);
            });

            // Cleanly paint active interactions upon deal compilation conclusion
            setTimeout(() => {
                renderHand(finalHandData);
                // Initialize default counters
                updateOpponentCounters('opponent-left', 7);
                updateOpponentCounters('opponent-top', 7);
                updateOpponentCounters('opponent-right', 7);
                highlightTurnIndicator('local-player');
                startTurnClockSimulation();
            }, (fullDealPipeline.length * frameIntervalRate) + 300);
        }

        // Simulated local game round countdown sound ticker clock loop
        function startTurnClockSimulation() {
            let ticksLeft = 15;
            activeTimerInterval = setInterval(() => {
                ticksLeft--;
                if (ticksLeft <= 0) {
                    clearInterval(activeTimerInterval);
                    return;
                }
                playTimerTickSound(ticksLeft <= 5);
            }, 1000);
        }

        // ---- the match clock --------------------------------------------------
        // Counts down in MM:SS from the round's total. It stops at 00:00 and stays
        // there rather than looping, so a demo left open settles on zero.
        let gameMatchTimerInterval = null;

        function initializeArcadeMatchTimer(startingSecondsTotal) {
            clearInterval(gameMatchTimerInterval);

            let currentTimerSeconds = startingSecondsTotal;
            const displayNode = document.getElementById('game-countdown-string');

            const paintClock = () => {
                if (!displayNode) return;
                const minutes = Math.floor(currentTimerSeconds / 60).toString().padStart(2, '0');
                const seconds = (currentTimerSeconds % 60).toString().padStart(2, '0');
                displayNode.innerText = `${minutes}:${seconds}`;
            };

            paintClock();

            gameMatchTimerInterval = setInterval(() => {
                currentTimerSeconds -= 1;
                if (currentTimerSeconds <= 0) {
                    currentTimerSeconds = 0;
                    paintClock();
                    clearInterval(gameMatchTimerInterval);
                    return;
                }
                paintClock();
            }, 1000);
        }

        // ---- chat -------------------------------------------------------------
        // There is no socket in this page, so nothing is sent anywhere. A canned
        // message pops a speech bubble over the local shelf, and an emoji floats up
        // out of the trigger. The networked client is the one that would transmit.
        function openChatInterface() {
            const tray = document.getElementById('chat-selection-tray');
            const trigger = document.getElementById('chat-trigger');
            if (!tray) return;
            const nowOpen = tray.classList.toggle('active-tray');
            if (trigger) {
                trigger.classList.toggle('open', nowOpen);
                trigger.setAttribute('aria-expanded', String(nowOpen));
            }
        }

        function closeChatTray() {
            const tray = document.getElementById('chat-selection-tray');
            const trigger = document.getElementById('chat-trigger');
            if (!tray || !tray.classList.contains('active-tray')) return;
            tray.classList.remove('active-tray');
            if (trigger) {
                trigger.classList.remove('open');
                trigger.setAttribute('aria-expanded', 'false');
            }
        }

        function flyEmote(glyph) {
            const flyer = document.createElement('div');
            flyer.className = 'emote-flyup';
            flyer.textContent = glyph;
            document.querySelector('.game-table').appendChild(flyer);
            note(680, 0.12, 'sine', 0.05, 0, 900);
            setTimeout(() => flyer.remove(), 1500);
        }

        // A bubble over the seat that said it, gone again after 2.5s.
        //
        // The local bubble is anchored to the table rather than to document.body:
        // an absolutely positioned bubble in the body is measured against the
        // initial containing block, and .game-table is a positioned 100vw/vh box on
        // top of it — so anchoring there is the same box, stated on purpose.
        function displayLiveSpeechBubbleHTML(targetSlotKey, chatStringText) {
            const seatAnchors = {
                left_enemy: document.getElementById('slot-opponent-left'),
                top_enemy: document.getElementById('slot-opponent-top'),
                right_enemy: document.getElementById('slot-opponent-right'),
                local_player: document.querySelector('.game-table')
            };

            const anchor = seatAnchors[targetSlotKey];
            if (!anchor) return;

            const bubble = document.createElement('div');
            bubble.className = targetSlotKey === 'local_player' ? 'speech-bubble-local' : 'speech-bubble-pop';
            bubble.innerText = chatStringText;
            anchor.appendChild(bubble);

            if (typeof playChatBubblePopSound === 'function') playChatBubblePopSound();

            setTimeout(() => {
                bubble.style.transition = 'opacity .25s ease';
                bubble.style.opacity = '0';
                setTimeout(() => bubble.remove(), 250);
            }, 2500);
        }

        function wireChat() {
            const trigger = document.getElementById('chat-trigger');
            const tray = document.getElementById('chat-selection-tray');
            if (!trigger || !tray) return;

            trigger.addEventListener('click', (event) => {
                // stopPropagation, or the document-level sweep below closes the tray
                // in the same click that opened it
                event.stopPropagation();
                openChatInterface();
                if (typeof playCardRuffleSound === 'function') playCardRuffleSound();
            });
            trigger.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    openChatInterface();
                }
            });

            tray.querySelectorAll('.chat-option-node').forEach((optionNode) => {
                const send = () => {
                    displayLiveSpeechBubbleHTML('local_player', optionNode.getAttribute('data-msg'));
                    closeChatTray();
                };
                optionNode.addEventListener('click', (event) => { event.stopPropagation(); send(); });
                optionNode.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        send();
                    }
                });
            });

            tray.querySelectorAll('.chat-emoji-row button').forEach((button) => {
                button.addEventListener('click', (event) => {
                    event.stopPropagation();
                    flyEmote(button.textContent.trim());
                    closeChatTray();
                });
            });

            // clicking out onto the table closes it
            document.addEventListener('click', closeChatTray);
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') closeChatTray();
            });
        }

        // ---- a draw penalty landing -------------------------------------------
        // The rattle, the sub-bass hit, and the cards going out one at a time to the
        // seat that has to take them. The seat's counter stack goes up by the same
        // number when the last card lands, so the penalty leaves the table changed and
        // not just shaken.
        const opponentHandSize = { 'opponent-left': 7, 'opponent-top': 7, 'opponent-right': 7 };

        const PENALTY_SLOT_TO_COUNTER = {
            left_enemy: 'opponent-left',
            top_enemy: 'opponent-top',
            right_enemy: 'opponent-right'
        };

        // A plain wild draws nothing in the real rules. This page has no server to send a
        // PLAYER_PENALTY_HIT, so the local wild stands in as the demo's trigger: it is the
        // one place to change when a real penalty packet arrives, and the function itself
        // takes the seat and the count so a packet can call it as it is.
        const DEMO_PENALTY_ON_WILD = { seat: 'left_enemy', cards: 4 };

        function handleDraw4PenaltyImpact(targetPlayerSlotKey, totalCardsToDraw = 4) {
            const tableCanvasNode = document.querySelector('.game-table');
            const deckSourceNode = document.getElementById('central-deck');
            if (!tableCanvasNode || !deckSourceNode) return;

            // Restart from the top if a shake is already running: the forced reflow is what
            // lets the same animation fire twice in a row.
            tableCanvasNode.classList.remove('penalty-shake-active');
            void tableCanvasNode.offsetWidth;
            tableCanvasNode.classList.add('penalty-shake-active');

            if (typeof playDraw4ImpactDamageSound === 'function') playDraw4ImpactDamageSound();

            const deckBounds = deckSourceNode.getBoundingClientRect();
            const deckX = deckBounds.left + deckBounds.width / 2;
            const deckY = deckBounds.top + deckBounds.height / 2;

            const slotNodeLookups = {
                left_enemy: document.getElementById('slot-opponent-left'),
                top_enemy: document.getElementById('slot-opponent-top'),
                right_enemy: document.getElementById('slot-opponent-right'),
                local_player: document.getElementById('local-player-hand')
            };

            const destinationNode = slotNodeLookups[targetPlayerSlotKey];
            if (!destinationNode) return;

            const destBounds = destinationNode.getBoundingClientRect();
            const targetX = destBounds.left + destBounds.width / 2;
            const targetY = destBounds.top + destBounds.height / 2;

            // 110ms apart, so they read as cards being dealt at you rather than one clump
            for (let cardIdx = 0; cardIdx < totalCardsToDraw; cardIdx += 1) {
                setTimeout(() => {
                    const flightCardNode = document.createElement('div');
                    flightCardNode.classList.add('card-in-flight');

                    flightCardNode.style.setProperty('--deck-x', `${deckX}px`);
                    flightCardNode.style.setProperty('--deck-y', `${deckY}px`);
                    flightCardNode.style.setProperty('--target-x', `${targetX}px`);
                    flightCardNode.style.setProperty('--target-y', `${targetY}px`);
                    flightCardNode.style.setProperty('--target-rot', `${(Math.random() * 40) - 20}deg`);

                    tableCanvasNode.appendChild(flightCardNode);
                    requestAnimationFrame(() => flightCardNode.classList.add('thrown'));

                    if (typeof playCardRuffleSound === 'function') playCardRuffleSound();
                    setTimeout(() => flightCardNode.remove(), 580);
                }, cardIdx * 110);
            }

            // The seat holds them now. Timed to the last card landing, not to the click.
            const counterKey = PENALTY_SLOT_TO_COUNTER[targetPlayerSlotKey];
            if (counterKey) {
                setTimeout(() => {
                    opponentHandSize[counterKey] += totalCardsToDraw;
                    updateOpponentCounters(counterKey, opponentHandSize[counterKey]);
                }, (totalCardsToDraw - 1) * 110 + 600);
            }

            setTimeout(() => tableCanvasNode.classList.remove('penalty-shake-active'), 460);
        }

        // ---- the wild colour wheel --------------------------------------------
        // Four quadrants, one choice, and the choice does not travel anywhere: this
        // page has no socket, so declaring a colour re-tints the wild card that is
        // already on the pile, which is what a declared colour looks like on the
        // table. The networked client is the one that sends the intent.
        let awaitingWildCard = null;

        const WILD_COLOURS = ['red', 'blue', 'yellow', 'green'];

        function presentColorPickerWheel() {
            const wheel = document.getElementById('wild-color-picker');
            if (!wheel) return;
            wheel.classList.add('visible');
            if (typeof playColorWheelOpenSound === 'function') playColorWheelOpenSound();
        }

        function concealColorPickerWheel() {
            const wheel = document.getElementById('wild-color-picker');
            if (wheel) wheel.classList.remove('visible');
        }

        function declareWildColor(chosenColour) {
            // Only the four known colours may become a class name on the card.
            const picked = String(chosenColour || '').toLowerCase();
            if (WILD_COLOURS.indexOf(picked) === -1) return;

            if (typeof playCardSlamSound === 'function') playCardSlamSound();

            if (awaitingWildCard) {
                WILD_COLOURS.forEach((colour) => awaitingWildCard.classList.remove(colour));
                awaitingWildCard.classList.add(picked);
                awaitingWildCard = null;
            }

            concealColorPickerWheel();

            // The colour is declared, so the penalty that follows a wild is applied.
            handleDraw4PenaltyImpact(DEMO_PENALTY_ON_WILD.seat, DEMO_PENALTY_ON_WILD.cards);
        }

        function wireColorWheel() {
            const wheel = document.getElementById('wild-color-picker');
            if (!wheel) return;

            wheel.querySelectorAll('.color-quadrant').forEach((quadrant) => {
                const choose = () => declareWildColor(quadrant.getAttribute('data-color'));
                quadrant.addEventListener('click', choose);
                quadrant.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        choose();
                    }
                });
            });

            // A modal that cannot be left is a trap: the backdrop and Escape both
            // dismiss it without declaring anything.
            wheel.addEventListener('click', (event) => {
                if (event.target === wheel) concealColorPickerWheel();
            });
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && wheel.classList.contains('visible')) concealColorPickerWheel();
            });
        }

        // ---- calling UNO ------------------------------------------------------
        // The UNO button has been in this page's controls panel since it was written
        // and nothing has ever listened to it. Now it does: the banner bursts in, the
        // fanfare plays, confetti leaves the middle of the screen, and the banner
        // leaves after 1.8s. There is no socket in this page, so nothing is announced
        // to anyone — the networked client is the one that would send the call.
        function spawnUnoConfettiExplosion() {
            const overlay = document.getElementById('uno-callout-overlay');
            if (!overlay) return;

            const particleCount = 45;
            const particleColors = ['#ff1744', '#0066ff', '#ffcc00', '#00cc44', '#ffffff'];

            for (let i = 0; i < particleCount; i += 1) {
                const particle = document.createElement('div');
                particle.classList.add('uno-particle');

                // out from the middle in every direction, at every distance
                const angle = Math.random() * Math.PI * 2;
                const distance = 80 + (Math.random() * 240);

                particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
                particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
                particle.style.setProperty('--color', particleColors[Math.floor(Math.random() * particleColors.length)]);
                particle.style.setProperty('--size', `${8 + (Math.random() * 14)}px`);
                particle.style.setProperty('--radius', Math.random() > .5 ? '50%' : '4px');
                particle.style.setProperty('--duration', `${0.6 + (Math.random() * 0.5)}s`);
                particle.style.setProperty('--rot', `${(Math.random() * 720) - 360}deg`);

                overlay.appendChild(particle);
                setTimeout(() => particle.remove(), 1200);
            }
        }

        function triggerUnoDeclarationBanner(declaringPlayerName) {
            const banner = document.getElementById('uno-banner-card');
            const subtext = document.getElementById('uno-banner-subtext');
            if (!banner || !subtext) return;

            subtext.innerText = `${declaringPlayerName} CALLED UNO!`;

            // Clear both classes, force a reflow, then animate in. The reflow is what
            // lets the same animation run twice: without it the browser coalesces the
            // class change and a second call does nothing.
            banner.classList.remove('animate-in', 'animate-out');
            void banner.offsetWidth;

            banner.classList.add('animate-in');
            if (typeof playUnoDeclarationSound === 'function') playUnoDeclarationSound();
            spawnUnoConfettiExplosion();

            setTimeout(() => {
                banner.classList.remove('animate-in');
                banner.classList.add('animate-out');
            }, 1800);
        }

        // ---- the round victory screen -----------------------------------------
        // Opens when the local hand empties — the only thing in this page that ends a
        // round. The leaderboard is built from the mock's own seat data, and the points
        // follow the server's rule: the winner is paid what everybody else still holds.
        function presentVictoryScoreboardScreen(winnerName, pointsWonThisRound, leaderboardRows) {
            const backdrop = document.getElementById('victory-screen-modal');
            const rowsBox = document.getElementById('leaderboard-rows-box');
            if (!backdrop || !rowsBox) return;

            document.getElementById('winner-name-string').innerText = winnerName;
            document.getElementById('round-points-value').innerText = pointsWonThisRound;

            rowsBox.innerHTML = '';
            leaderboardRows.forEach((entry) => {
                const row = document.createElement('div');
                row.classList.add('leaderboard-row-bar');
                if (entry.isYou) row.classList.add('is-local-leader');

                const who = document.createElement('span');
                who.textContent = entry.name;           // textContent, never innerHTML: a name is data
                const pts = document.createElement('span');
                pts.style.color = '#ffcc00';
                pts.textContent = `${entry.totalScore} PTS`;

                row.append(who, pts);
                rowsBox.appendChild(row);
            });

            backdrop.classList.add('reveal-victory');
            if (typeof playUnoDeclarationSound === 'function') playUnoDeclarationSound();
        }

        function concealVictoryScoreboard() {
            const backdrop = document.getElementById('victory-screen-modal');
            if (backdrop) backdrop.classList.remove('reveal-victory');
        }

        function finishRoundLocally() {
            const winner = playersMock.find((p) => p.id === 'p_local');
            if (!winner) return;

            const pointsWon = playersMock.reduce((sum, p) => (p.id === winner.id ? sum : sum + (p.handPoints || 0)), 0);

            // Banked, so a second round in this demo starts from these totals instead of
            // scoring the same round twice.
            winner.score += pointsWon;

            // A wild as the last card opens the colour wheel AND ends the round. The
            // round being over makes the colour moot, so the wheel goes first rather
            // than sitting under the victory screen waiting for an answer.
            concealColorPickerWheel();

            const leaderboardRows = playersMock.map((p) => ({ name: p.name, totalScore: p.score, isYou: p.id === winner.id }));
            presentVictoryScoreboardScreen(winner.name, pointsWon, leaderboardRows);
        }

        function startNextLocalRound() {
            concealVictoryScoreboard();
            document.getElementById('local-player-hand').innerHTML = '';
            // There is no socket in this page, so nobody is told we are ready and no
            // server deals again. The page deals again itself, because a demo that
            // cannot start a second round cannot show its own loop.
            setTimeout(() => initializeCinematic3DDeal(playersMock, localHandMock), 250);
        }

        function wireVictoryScreen() {
            const backdrop = document.getElementById('victory-screen-modal');
            const nextButton = document.getElementById('next-round-ready-trigger');
            if (nextButton) nextButton.addEventListener('click', startNextLocalRound);
            if (backdrop) {
                backdrop.addEventListener('click', (event) => { if (event.target === backdrop) startNextLocalRound(); });
            }
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && backdrop && backdrop.classList.contains('reveal-victory')) startNextLocalRound();
            });
        }

        // Automatically auto-boot sequence triggers on window load
        window.addEventListener('DOMContentLoaded', () => {
            wireChat();
            wireColorWheel();
            wireVictoryScreen();
            const unoButton = document.getElementById('btn-uno-call');
            if (unoButton) unoButton.addEventListener('click', () => triggerUnoDeclarationBanner('Champ'));
            initializeArcadeMatchTimer(149);   // 02:29
            // Initiates full simulated arcade dealing engine sequence matching layout blueprints
            setTimeout(() => {
                initializeCinematic3DDeal(playersMock, localHandMock);
            }, 800);
        });
    </script>
</body>
</html>
