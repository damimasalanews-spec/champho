<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover: without it a notched phone held sideways lays the page out
         only inside the safe area and paints the strips either side of it with the page
         background — two bands down the sides of the screen, which is the shape of the
         bug the player keeps reporting. With it the page reaches the corners and the
         insets become .viewport-frame's padding, which is what the board is kept out of
         (see applyStageScale) while the table illustration runs edge to edge underneath. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Installable app + offline: see manifest.json, sw.js and game/pwa.js.
         The manifest and the service worker are what make this a real app on a phone
         (home-screen icon, standalone window, landscape lock) and what keeps it
         playable with no network. -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1c4d06">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Champ Word">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">

    <title>Champ Word Go Wild</title>
    <!-- This page's sheet came in as game/wild-arcade.css rather than replacing
         game/styles.css, because game/styles.css is shared: game/index.html
         (Classic) and game/emotes.html both load it, and overwriting it with this
         page's sheet would strip Classic of its styling. game/sound.js stays
         shared as-is — the one function this page needs that it lacked,
         playTimerTickSound, was added to it instead. -->
    <link rel="stylesheet" href="game/wild-arcade.css?v=5">
</head>
<body>

  <!-- High-Fidelity Network Initialization SplashScreen Layer -->
  <div id="app-loading-screen" class="game-loading-overlay">
    <h1 class="loading-title-brand">CHAMP WORD</h1>
    <div class="loading-subtitle-brand">The Word Card Battle</div>
    
    <!-- Vector Hardware Accelerated Loader Ring -->
    <div class="arcade-spinner-ring"></div>
    
    <!-- Dynamic State Update Message String -->
    <div id="loading-status-string" class="loading-status-text">CONNECTING TO AUTHORITATIVE SEATS...</div>
  </div>

  <!-- The main table architecture layout sits cleanly below -->

    <!-- Full Screen Graphic Effects Layer -->
    <div id="screen-effects" class="screen-effect-layer"></div>

    <!-- ======================================================================
         THE 16:9 STAGE

         The table is no longer a free-flowing 100vw x 100vh page. It is a fixed
         1920x1080 board scaled to fit whatever viewport it lands in, so the board
         is identical on a desktop at 1920x1080 and on a phone held sideways — the
         same seats, the same piles, the same hand — just smaller. --stage-scale is
         that factor, written by applyStageScale() on load and on every resize.

         Sizing only. The arrangement inside the board is the original one, untouched;
         the sheet's positions resolve against the 1920x1080 stage instead of the
         window, which is the whole of the change.

         .viewport-frame is the letterbox: it centres the stage and clips what
         overflows. The board's own HUD — seats, piles, hand, clock, action buttons,
         chat tray — is inside the stage and scales with it, which is what makes the
         composition identical at every size. The four full-screen overlays that are
         NOT board furniture (the colour wheel, the UNO banner, the victory screen,
         the shockwave rim) stay at body level, outside the frame, where they are
         still sized in real device pixels and so still fill a real screen.
         ====================================================================== -->
    <div class="viewport-frame">
    <div class="stage" id="game-stage">

    <div class="game-table">

        <!-- Match clock: top left, counting down MM:SS -->
        <div class="arcade-timer-badge">
            <span class="clock-glyph" aria-hidden="true">⏱️</span>
            <span id="game-countdown-string">02:29</span>
        </div>

        <!-- Settings, top-right corner. Board furniture, so it lives in the stage and
             scales with everything else.

             The spec calls for a gear icon and no behaviour, but a button that does
             nothing when tapped is worse than no button, so this one drives the only
             setting the page has: the sound. The glyph stays a gear — the spec's icon —
             and the muted state shows as a dimmed, struck-through treatment plus
             aria-pressed, rather than by swapping the icon out. -->
        <button class="arcade-settings-btn" id="settings-trigger" type="button"
                aria-label="Sound on — tap to mute" aria-pressed="false">
            <span class="gear-glyph" aria-hidden="true">⚙</span>
        </button>

        <!-- Live Neon Turn Indicator Rig -->
        <div class="floating-turn-ring">
            <div class="direction-arrow arrow-top" id="arrow-opponent-top"></div>
            <div class="direction-arrow arrow-right" id="arrow-opponent-right"></div>
            <div class="direction-arrow arrow-bottom" id="arrow-local-player"></div>
            <div class="direction-arrow arrow-left" id="arrow-opponent-left"></div>
        </div>

        <!-- THE DRAW PACKET. ONE packet, upper-left of the central play area.

             The layout spec is explicit that there must be only one draw/UNO box, so the
             Card Cascade that used to sit beside this one is gone — two stacks of cards
             in the same corner read as two packets, which is exactly what the spec rules
             out. The deck keeps its id: the deal and the flight animations read its rect,
             so they follow it wherever it sits.

             The UNO face on the deck is .draw-deck-source::before, already in the sheet. -->
        <div class="top-left-deck-group">
            <div class="draw-deck-source draw-pile-3d" id="central-deck"></div>
        </div>

        <!-- The throw box: the dashed surface the played cards land on. -->
        <div class="center-play-zone" id="center-board-zone">
            <div class="discard-pile" id="discard-deck-pile"></div>
        </div>

        <!-- Peripheral Seating Layout Slots.

             These carry the cosmetic portrait frames and the name pill tags, but the
             slot and counter ids are UNCHANGED from what the brief for the avatar work
             proposed (player-container-left / count-stack-left). The deal pipeline, the
             turn arrows, the speech bubbles, the emote anchors and the penalty strike
             all look a seat up as slot-opponent-* / count-stack-opponent-*, so the
             proposed ids would have left every one of them pointing at null: no cards
             flying to a seat, and counters that never reset between rounds. -->
        <!-- CHAIR LEFT SLOT: Kalkal -->
        <div class="player-slot opponent-left" id="slot-opponent-left">
            <div class="opponent-profile-wrapper avatar-hud-wrapper">
                <div class="avatar-frame" id="avatar-img-left">
                    <div class="avatar-container">👩</div>
                </div>
                <div class="player-pill-tag">Kalkal</div>
                <div class="opponent-card-count-stack" id="count-stack-opponent-left"></div>
                <!-- The hidden hand, as card backs. Sits under the count rather than
                     replacing it: the count is what the penalty strike and the round
                     reset already keep honest, and the fan is what makes a seat look
                     like it is holding cards. -->
                <div class="opponent-fan-tray" id="fan-hand-left"></div>
            </div>
        </div>

        <!-- CHAIR TOP SLOT: Poker, sitting opposite and playing open.

             The top seat is the partner, so its hand is dealt face up rather than
             hidden. That is why it carries an open card rack and no count: seven
             cards you can read do not need a digit standing in for them. The left
             and right seats keep their counts, because their hands are face down. -->
        <div class="player-slot opponent-top" id="slot-opponent-top">
            <!-- The opposite seat reads as a row: the portrait on the left, its open hand
                 to the right of it. The portrait column keeps .avatar-hud-wrapper so the
                 turn ring and the level star stay anchored to the face — hung on the
                 whole row instead, they would sit ~200px away from the head they are
                 meant to circle. -->
            <div class="opponent-top-row">
                <div class="opponent-profile-wrapper avatar-hud-wrapper">
                    <div class="avatar-frame" id="avatar-img-top">
                        <div class="avatar-container">👩‍🦰</div>
                    </div>
                    <div class="player-pill-tag">Poker</div>
                </div>
                <div class="opponent-top-hand" id="teammate-hand-container"></div>
            </div>
        </div>

        <!-- CHAIR RIGHT SLOT: Jess -->
        <div class="player-slot opponent-right" id="slot-opponent-right">
            <div class="opponent-profile-wrapper avatar-hud-wrapper">
                <div class="avatar-frame" id="avatar-img-right">
                    <div class="avatar-container">👨</div>
                </div>
                <div class="player-pill-tag">Jess</div>
                <div class="opponent-card-count-stack" id="count-stack-opponent-right"></div>
                <!-- The hidden hand, as card backs. Sits under the count rather than
                     replacing it: the count is what the penalty strike and the round
                     reset already keep honest, and the fan is what makes a seat look
                     like it is holding cards. -->
                <div class="opponent-fan-tray" id="fan-hand-right"></div>
            </div>
        </div>

        <!-- CHAIR BOTTOM SLOT: Local User (Champ / You).

             Positioned by .local-user-slot in the sheet, not inline. It used to carry
             style="bottom: 25px; left: 214px;" — a bottom-left offset measured against a
             1280x900 viewport to dodge the chat tray. The spec now fixes this seat at
             X 170 / Y 820 on the 1920x1080 board, and an inline style outranks a
             stylesheet, so the offset had to go to the sheet to be overridable at all.

             local-user-slot is also the seat's name in the stylesheet, and it is what
             gives this pill its own colour. The label stays "Champ" rather than the
             brief's "Cw": the UNO banner announces this seat as CHAMP, and two names for
             one player on the same screen is a worse bug than a mismatched pill. -->
        <div class="player-slot local-user-slot" id="slot-local-player">
            <div class="avatar-hud-wrapper">
                <div class="avatar-frame" id="avatar-img-local">
                    <div class="avatar-container">🧑</div>
                </div>
                <div class="player-pill-tag">Champ</div>
            </div>
        </div>

        <!-- Local Interactive Player Base Container -->
        <div class="hand-container" id="local-player-hand"></div>

        <!-- Control Action Panel -->
        <div class="controls-panel">
            <button class="btn-arcade" id="btn-uno-call">CALL UNO</button>
        </div>

        <!-- Chat. Local only: this page has no socket, so these float up and play a
             note instead of reaching anyone. The networked page is the one that
             actually sends a message. -->
        <!-- One tray, two groups: the canned messages above, the emoji that were
             already on this page below. -->
        <div class="chat-picker-tray" id="chat-selection-tray">
            <div class="chat-option-node" data-msg="Hello! 👋" role="button" tabindex="0">Hello! 👋</div>
            <div class="chat-option-node" data-msg="Good Game! 🌟" role="button" tabindex="0">Good Game! 🌟</div>
            <div class="chat-option-node" data-msg="Oops! 🙈" role="button" tabindex="0">Oops! 🙈</div>
            <div class="chat-option-node" data-msg="Hurry Up! ⏱️" role="button" tabindex="0">Hurry Up! ⏱️</div>
            <div class="chat-emoji-row">
                <button type="button">😀</button>
                <button type="button">😂</button>
                <button type="button">😮</button>
                <button type="button">😎</button>
                <button type="button">🔥</button>
                <button type="button">👏</button>
                <button type="button">😭</button>
                <button type="button">🎉</button>
            </div>
        </div>
        <div class="chat-bubble-trigger" id="chat-trigger" role="button" tabindex="0" aria-label="Chat">💬</div>
    </div>

    <!-- The card-throw flight rig. Inside .stage, but OUTSIDE .game-table — the one
         spot that satisfies both constraints. It cannot live in the table, because
         the table carries a perspective and the penalty strike animates the table's
         transform, and a flyer inside it would inherit both. It cannot live at body
         level either, now that the board is scaled: at body level its 105x158 flyer
         is a real 105x158 on screen while the board's cards are 105x158 x
         --stage-scale, so on a phone the flying card would be three times the size
         of the card it came from.

         Here it inherits the stage's scale, so its cards ARE the board's cards, and
         the aim goes through stageRect(): the viewport rects from
         getBoundingClientRect converted into stage pixels. One conversion, one
         place, and the flyer can never disagree with what was painted. -->
    <div id="throw-camera-rig">
        <div id="throw-flight-layer">
            <div id="throw-impact-ring"></div>
            <div id="throw-flight-card" style="opacity: 0;"></div>
        </div>
    </div>

    </div>
    </div>

    <!-- The wild colour wheel. Deliberately OUTSIDE .game-table: the table carries
         perspective, and a perspective ancestor becomes the containing block for a
         fixed-position child, which would anchor this overlay to the table rather
         than to the viewport. -->
    <div id="wild-color-picker" class="color-picker-overlay">
        <div class="color-wheel-rig" role="group" aria-label="Choose a colour">
            <div class="color-quadrant quad-red" data-color="RED" role="button" tabindex="0" aria-label="Red"></div>
            <div class="color-quadrant quad-blue" data-color="BLUE" role="button" tabindex="0" aria-label="Blue"></div>
            <div class="color-quadrant quad-yellow" data-color="YELLOW" role="button" tabindex="0" aria-label="Yellow"></div>
            <div class="color-quadrant quad-green" data-color="GREEN" role="button" tabindex="0" aria-label="Green"></div>
        </div>
    </div>

    <!-- The "UNO!" callout. Always present, never clickable (the overlay is
         pointer-events:none), and empty of geometry until it is given a class.
         Outside .game-table for the same reason as the wheel: the table's
         perspective would become this fixed element's containing block. -->
    <div id="uno-callout-overlay" class="uno-announcement-overlay">
        <div id="uno-banner-card" class="uno-announcement-banner">
            <h1 class="uno-announcement-text">UNO!</h1>
            <div id="uno-banner-subtext" class="uno-announcement-subtext">Champ called UNO!</div>
        </div>
    </div>

    <!-- The round victory screen. Opens when the local hand empties, which is the
         only thing in this page that ends a round. -->
    <div id="victory-screen-modal" class="victory-screen-backdrop">
        <div class="victory-card-rig">
            <h2 class="victory-header-text">ROUND OVER</h2>
            <div class="victory-winner-callout">
                <span id="winner-name-string">Champ</span> wins the round!
                <div class="points-badge-pop">+<span id="round-points-value">0</span> Points</div>
            </div>
            <div class="leaderboard-list-box" id="leaderboard-rows-box"></div>
            <button class="arcade-next-btn" id="next-round-ready-trigger">READY FOR NEXT ROUND</button>
        </div>
    </div>

    <!-- The penalty shockwave rim. Full screen, and outside .game-table for the same
         reason as the wheel and the banner: the strike animates the table's transform,
         and a fixed layer inside it would be shoved around with the table. -->
    <div id="screen-shockwave-layer" class="shockwave-vignette"></div>

    <!-- Held the wrong way up. The board is 16:9 and every measurement in it assumes
         a landscape viewport, so a portrait phone gets a 0.2x board in the middle of
         the screen and nothing readable. This asks for the rotation instead. It is a
         press-out overlay at body level, so it is sized in device pixels rather than
         stage pixels, and it is CSS-only — no script, no state. -->
    <div class="rotate-device-veil" aria-hidden="true">
        <div class="rotate-device-card">
            <div class="rotate-device-glyph">📱</div>
            <div class="rotate-device-text">Turn your device sideways</div>
        </div>
    </div>

    <!-- Script Execution Pipelines -->
    <!-- How far the table plate has to be zoomed for FELT to reach the frame's edges.
         Before sound.js and the page's own script, both of which are classic scripts, so
         it is defined by the time applyStageScale() runs. -->
    <script src="game/scene-fill.js"></script>
    <script src="game/sound.js"></script>
    <script>
        'use strict';

        // Mock WebSocket structural engine variables for runtime simulation testing
        let activeTimerInterval = null;
        // Seven cards, carrying the action kinds the table needs: the +2, the skip, the
        // reverse, the discard-all and the wild.
        //
        // `type` is what the effect branch keys off and `isAction` is what the typography
        // keys off. Note the wild's face is '★' and the skip's is '🚫': the face is display
        // only, so nothing may decide what a card DOES by reading it. See the effect branch
        // in executeLocalCardPlay.
        const localHandMock = [
            { id: 'c1', color: 'red', value: '3', type: 'number' },
            { id: 'c2', color: 'yellow', value: '+2', type: 'draw2', isAction: true },
            { id: 'c3', color: 'green', value: '🚫', type: 'skip', isAction: true },
            { id: 'c4', color: 'blue', value: '🔁', type: 'reverse', isAction: true },
            { id: 'c5', color: 'red', value: 'ALL', type: 'discard_all', isAction: true },
            { id: 'c6', color: 'wild', value: '★', type: 'wild', isAction: true },
            { id: 'c7', color: 'green', value: '6', type: 'number' }
        ];

        // The partner's hand, dealt face up at the top seat. On a networked client this
        // arrives as packet.teammateCards; here it rides on the mock like every other seat.
        const teammateHandMock = [
            { id: 't1', color: 'blue', value: '4', type: 'number' },
            { id: 't2', color: 'blue', value: '8', type: 'number' },
            { id: 't3', color: 'red', value: '1', type: 'number' },
            { id: 't4', color: 'yellow', value: '9', type: 'number' },
            { id: 't5', color: 'green', value: '5', type: 'number' },
            { id: 't6', color: 'wild', value: '★', type: 'wild', isAction: true },
            { id: 't7', color: 'blue', value: '6', type: 'number' }
        ];

        // The victory screen needs two numbers per seat that the deal did not: what the
        // seat has scored so far, and what the cards still in its hand are worth. The
        // second is the one the server computes with scoreHand() — the winner of a round
        // is paid the value of everybody else's remaining hand — so the mock carries the
        // same two facts rather than a formula of its own.
        // activeFrameSkin is the cosmetic each seat is wearing. On a networked client the
        // server pushes this per player; here it rides on the mock roster so all three
        // states — cyber, sheriff and the default fallback — are visible at once.
        const playersMock = [
            { id: 'p_left', name: 'Kalkal', tableSlotPosition: 'opponent-left', score: 320, handPoints: 34, activeFrameSkin: 'cyber' },
            { id: 'p_top', name: 'Poker', tableSlotPosition: 'opponent-top', score: 245, handPoints: 21, activeFrameSkin: 'sheriff' },
            { id: 'p_right', name: 'Jess', tableSlotPosition: 'opponent-right', score: 190, handPoints: 47, activeFrameSkin: 'default' },
            { id: 'p_local', name: 'Champ', tableSlotPosition: 'local-player', score: 417, handPoints: 0, activeFrameSkin: 'sheriff' }
        ];

        // Trigger visual effect flashes securely
        function triggerScreenFlash(effectClass) {
            const effectNode = document.getElementById('screen-effects');
            if (!effectNode) return;
            effectNode.className = 'screen-effect-layer';
            void effectNode.offsetWidth; // Force hardware redraw reflow repaint
            effectNode.classList.add(effectClass);
        }

        // Render Arched Player Hand UI dynamically with math variables
        function renderHand(cardsArray) {
            const handContainer = document.getElementById('local-player-hand');
            if (!handContainer) return;
            handContainer.innerHTML = '';

            const totalCards = cardsArray.length;
            const midIndex = (totalCards - 1) / 2;

            cardsArray.forEach((card, i) => {
                const cardEl = document.createElement('div');
                cardEl.classList.add('card', card.color);
                // The discard-all wears its own accent, so the face says what it does.
                if (card.type === 'discard_all') cardEl.classList.add('discard-all');

                // Add inner text nodes
                const valueEl = document.createElement('span');
                valueEl.classList.add('card-value');
                // Action faces are longer than a digit — "+2", "ALL", "★" — and at the 5rem
                // the numerals are set in they run past the card's border, so they take the
                // smaller size. isAction is the card's own flag; the length test is the
                // safety net for a card that turns up without one.
                if (card.isAction || String(card.value ?? '').length > 1) {
                    valueEl.classList.add('action-symbol');
                }
                valueEl.innerText = card.value;
                cardEl.appendChild(valueEl);

                // Add secondary design markers
                const leftCorner = document.createElement('div');
                leftCorner.classList.add('corner-value', 'corner-top-left');
                leftCorner.innerText = card.value;
                cardEl.appendChild(leftCorner);

                const rightCorner = document.createElement('div');
                rightCorner.classList.add('corner-value', 'corner-bottom-right');
                rightCorner.innerText = card.value;
                cardEl.appendChild(rightCorner);

                // Arc layouts calculations
                const offsetFromMiddle = i - midIndex;
                // The spec's small fan with the centre card raised. The sideways spread
                // is not here — it is --hand-step in the sheet (65px, which puts seven
                // 137px cards at the spec's ~527px hand width). These two are the tilt and
                // the lift that make it an arc rather than a row, and they are the top
                // seat's own 4deg and 5px: your hand is the same object as the partner's,
                // drawn on a different edge of the table.
                const rotationAngle = offsetFromMiddle * 4;
                const verticalDip = Math.abs(offsetFromMiddle) * 5;

                cardEl.style.setProperty('--index-offset', offsetFromMiddle);
                cardEl.style.setProperty('--arc-rotation', `${rotationAngle}deg`);
                cardEl.style.setProperty('--arc-y', `${verticalDip}px`);
                cardEl.style.setProperty('--card-index', i);

                // Add audio triggers natively
                cardEl.addEventListener('mouseenter', () => {
                    playCardRuffleSound();
                });

                cardEl.addEventListener('click', () => {
                    // The slam moved into the throw's impact frame — the sound belongs
                    // to the moment the card hits the pile, not the moment of the click.
                    executeLocalCardPlay(card, cardEl);
                });

                handContainer.appendChild(cardEl);
            });
        }

        // ==================================================================
        // THE CARD THROW
        //
        // The old version appended the card to the pile in the same tick it was
        // clicked — correct state, zero theatre. This is the replacement: one
        // requestAnimationFrame timeline that carries the selected card from the
        // hand to the pile with a launch, a spin, a snap and a spark burst.
        //
        // The timeline, in seconds:
        //   0.00-0.08  anticipation — the card lifts and scales slightly
        //   0.08-0.30  the throw — fast curve, strong accel then decel
        //   0.30-0.42  rotation decelerates, card aligns to the pile
        //   0.42-0.50  impact — snap, squash-and-stretch, bounce, particle burst
        //   0.50-0.65  settle — the card hands itself to the pile and the camera
        //              returns to rest
        // ==================================================================
        let cardThrow = null;                 // the one throw in flight at a time
        let throwCameraX = 0, throwCameraY = 0;   // smoothed camera follow
        let throwCameraTX = 0, throwCameraTY = 0; // camera follow target
        const throwSparks = [];               // impact particles, pooled and removed

        // ==================================================================
        // THE STAGE — fixed height, flexible width
        //
        // The board used to be a fixed 1920x1080 scaled to FIT the screen. That is what
        // left bands down the sides of every phone: a phone in landscape is about 2.16:1
        // and the board is 16:9, so fitting it by height could only ever fill 82% of the
        // width. Filling it by WIDTH instead would have cropped the timer off the top and
        // the hand off the bottom.
        //
        // So neither. The board keeps its 1080 height and its scale is always
        // viewportHeight/1080, and the WIDTH becomes whatever the screen needs — 1920 on a
        // 16:9 display, 2337 on a 2.16:1 phone. The play area is centred either way, and
        // the things that belong in the corners (the opponents, the clock, the buttons)
        // are anchored to the board's left and right edges rather than to fixed
        // coordinates, so they follow those edges out to the screen.
        //
        // At 16:9 this is arithmetically identical to what it was: scale 1, width 1920.
        //
        // stageRect() reads the conversion back off the element's own box instead of
        // trusting a cached number. A resize that lands between two frames can then never
        // leave the flyer aimed at where the pile used to be: to do that, the stage would
        // have to lie about its own bounding box.
        // ==================================================================
        const STAGE_W = 1920, STAGE_H = 1080;

        // The device insets the host page measured, if this page is running inside it.
        //
        // The installed app opens this table in a full-screen iframe, and env() resolves to
        // zero inside an iframe — so the page cannot see the phone's notch on its own. The
        // host can, and posts what it measured with the player's profile, which arrives well
        // before the first card is dealt. Null means nobody has told us: fall back to this
        // page's own computed insets, which is exactly right when it IS the top document.
        var hostInsets = null;

        window.addEventListener('message', function (event) {
            const data = event && event.data;
            if (!data || !data.champSafeArea) return;
            const s = data.champSafeArea;
            hostInsets = {
                top: parseFloat(s.top) || 0, right: parseFloat(s.right) || 0,
                bottom: parseFloat(s.bottom) || 0, left: parseFloat(s.left) || 0,
            };
            applyStageScale();
        });

        // The box the board is fitted into, and the two numbers that describe its shape.
        //
        // Both come off .viewport-frame rather than off the window. On a notched phone held
        // sideways that element is the whole screen — the page is viewport-fit=cover — and
        // it carries the device's safe insets as padding, because the black pill of the home
        // indicator and the rounded corners sit there. The board belongs inside those
        // insets, so the fit uses the padding box minus the padding, and the plate behind it
        // is left to cover the frame entire. Everywhere without insets — every desktop, every
        // Android — the padding is 0 and this is simply the viewport.
        function frameBox() {
            const frame = document.querySelector('.viewport-frame');
            const w = frame ? frame.clientWidth : 0;
            const h = frame ? frame.clientHeight : 0;
            if (!w || !h) {
                // Before the frame exists, or a page without one: the window is the best
                // answer available, and it is the right one on any screen without insets.
                return { w: window.innerWidth, h: window.innerHeight,
                         safeW: window.innerWidth, safeH: window.innerHeight,
                         shiftX: 0, shiftY: 0 };
            }
            const cs = getComputedStyle(frame);
            // The host's insets when there are any — see hostInsets above. env() resolves
            // to zero inside an iframe, so on its own this page cannot tell that a phone's
            // notch is sitting over the left edge of the board.
            const host = hostInsets || {};
            const pl = host.left != null ? host.left : (parseFloat(cs.paddingLeft) || 0);
            const pr = host.right != null ? host.right : (parseFloat(cs.paddingRight) || 0);
            const pt = host.top != null ? host.top : (parseFloat(cs.paddingTop) || 0);
            const pb = host.bottom != null ? host.bottom : (parseFloat(cs.paddingBottom) || 0);
            return {
                w, h,
                safeW: w - pl - pr,
                safeH: h - pt - pb,
                // How far the safe box's centre sits from the frame's, so the board can be
                // centred in the safe box rather than in the screen. Read by .stage's own
                // transform, in screen pixels — inside the scale it would be multiplied by
                // the board's scale and land somewhere else entirely.
                shiftX: (pl - pr) / 2,
                shiftY: (pt - pb) / 2,
            };
        }

        // How far the plate behind the board has to be zoomed for its felt — not the plate
        // itself — to reach all four edges of the frame. See game/scene-fill.js: the answer
        // depends on the frame's shape and on which plate rows end up visible, so it is
        // solved from the plate's measured felt spans rather than fixed per breakpoint.
        function applySceneFill(frame, box) {
            const fill = window.ChampWordSceneFill;
            if (!fill || !frame) return;
            const zoom = fill.fillZoom(box.w, box.h);
            // A null answer means no zoom inside the cap covers this shape. `cover` is what
            // the stylesheet declares and it fills the frame at every aspect, so that is the
            // fallback: the plate's own water stays visible there rather than a gap opening.
            frame.style.backgroundSize = zoom ? (zoom * 100) + '% auto' : 'cover';
        }

        function applyStageScale() {
            const box = frameBox();

            // The scale is the SMALLER of the two fits, and that choice is what protects
            // the board's 1920 width on a narrow screen. Taking the height alone and
            // forcing the width up to at least 1920 made the board 1365px wide inside a
            // 1024px iPad: the seats sit at the board's edges, so an over-wide board
            // pushes both of them off the sides. Measured, not theorised.
            const scale = Math.min(box.safeW / STAGE_W, box.safeH / STAGE_H);
            const usable = scale > 0 ? scale : 1;

            // Then widen the board until it covers the screen's width too. On a screen
            // wider than 16:9 that is wider than 1920 and the board itself reaches both
            // sides, which is the 1536x709 case. On 16:9 and narrower it stays exactly
            // 1920 and the scene behind it fills whatever is left over.
            const width = Math.max(STAGE_W, box.safeW / usable);
            document.documentElement.style.setProperty('--stage-scale', String(usable));
            document.documentElement.style.setProperty('--stage-w', Math.round(width) + 'px');
            document.documentElement.style.setProperty('--stage-shift-x', box.shiftX + 'px');
            document.documentElement.style.setProperty('--stage-shift-y', box.shiftY + 'px');

            // The plate is sized from the FRAME, not from the safe box: it covers the whole
            // frame, insets included, and only the board inside it is inset.
            applySceneFill(document.querySelector('.viewport-frame'), box);
        }

        function stageRect() {
            const el = document.getElementById('game-stage');
            if (!el) return { left: 0, top: 0, scale: 1, width: STAGE_W };
            const r = el.getBoundingClientRect();
            return {
                left: r.left,
                top: r.top,
                // From the HEIGHT, not the width. The board's height is always 1080;
                // its width now varies with the screen, so dividing by the constant
                // width would scale the conversion by however much wider the board got.
                scale: r.height / STAGE_H || 1,
                width: r.width,
            };
        }

        // The flyer's own box, in stage pixels: the size of the card it becomes when it
        // lands on the discard pile. That is no longer the size of a card in the hand —
        // the spec gives the hand 125x175, the discard 130x180 and the draw packet
        // 145x185 — so there is no single "table card" left to hard-code here. Read back
        // off the flyer's own computed width, the sheet stays the one place it is set.
        function flyerBox() {
            const el = document.getElementById('throw-flight-card');
            if (!el) return { w: 105, h: 158 };
            const cs = getComputedStyle(el);
            return {
                w: parseFloat(cs.width) || 105,
                h: parseFloat(cs.height) || 158,
            };
        }

        // A viewport rect — what the DOM hands back, already scaled — as a point in
        // stage pixels, which is what the flight layer draws in.
        function toStagePoint(viewportRect, stage) {
            return {
                x: (viewportRect.left + viewportRect.width / 2 - stage.left) / stage.scale,
                y: (viewportRect.top + viewportRect.height / 2 - stage.top) / stage.scale,
            };
        }

        window.addEventListener('resize', applyStageScale);
        window.addEventListener('orientationchange', applyStageScale);
        applyStageScale();

        // The easing curves the spec calls for: strong acceleration out of the
        // hand, smooth deceleration into the pile, spin that dies out before land.
        function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
        function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - 4 * Math.pow(1 - t, 3); }
        function easeInOutQuart(t) { return t < 0.5 ? 8 * t * t * t * t : 1 - 8 * Math.pow(1 - t, 4); }

        // The timeline, in seconds, as one object rather than as magic numbers
        // scattered through the phase branches: the boundaries the brief names, and
        // the two constants the flight is built from.
        const THROW = {
            lift: 0.08,      // anticipation ends — the hand lets go
            align: 0.30,     // the throw ends, the deceleration and alignment begin
            land: 0.42,      // first contact with the pile
            rest: 0.50,      // the flyer hands the card over and the sparks fly
            spin: 720,       // ~2 rotations end to end
            arcZ: 74,        // how far the card leaves the table plane at mid-flight
            cameraLag: 14.4, // camera follow time constant (1/s); the old 0.224/frame
        };

        function playCardLaunchWhoosh() {
            if (typeof whoosh === 'function') whoosh(0.22, 0.05, 0, 1400);
        }

        function throwCardVisual(cardData, cardElement, onLanded) {
            const table = document.querySelector('.game-table');
            const flightLayer = document.getElementById('throw-flight-layer');
            if (!table || !flightLayer) { onLanded(); return; }

            // A request for less motion skips the theatre entirely: the card lands,
            // the effects still fire, nothing flies across the table.
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                cardElement.remove();
                onLanded();
                return;
            }

            // Where the card sits now, and where it has to end up. The pile rotates
            // 24° about X with the table, so the raw rect is measured mid-transform:
            // close enough to aim with, and exactly what the player's eye judges by.
            // Both rects arrive in device pixels and the flight layer draws in stage
            // pixels. One conversion, here, so every number downstream — the curve,
            // the camera look-at, the landing point — is in the same units as the
            // board the player is actually looking at.
            const stage = stageRect();
            const from = cardElement.getBoundingClientRect();
            const pile = document.getElementById('discard-deck-pile').getBoundingClientRect();
            const p0 = toStagePoint(from, stage);
            const p2 = toStagePoint(pile, stage);

            // The control point of the curve: lifted above both ends, and bowed out
            // to one side.
            //
            // The bow is not decoration. The local hand sits directly under the throw
            // box, so on a centred card dx is ~0 and the arc above both ends would put
            // the control point on the same vertical line as the two ends — a three-
            // point quadratic with collinear points IS a straight line, and the throw
            // measured 4px off its own chord. Bowing the control point sideways by a
            // share of the travel distance gives every throw a real arc, and taking the
            // side from spinDir means the card sweeps out in the direction it banks.
            const dx = p2.x - p0.x, dy = p2.y - p0.y;
            const travel = Math.hypot(dx, dy);
            const arc = Math.min(300, Math.max(90, travel * 0.38));
            const bow = Math.min(150, Math.max(45, travel * 0.22));
            const spinDir = dx >= 0 ? -1 : 1;         // rolling toward the throw
            const p1 = {
                x: (p0.x + p2.x) / 2 - dx * 0.10 + spinDir * bow,
                y: Math.min(p0.y, p2.y) - arc,
            };
            const tilt0 = parseFloat(cardElement.style.getPropertyValue('--arc-rotation')) || 0;
            // The hand card's width relative to the FLYER's, in stage pixels: the measured
            // rect is scaled by the stage, so the stage scale comes back out of it and what
            // is left is the hand's own scale against its own card (1, or 1.25 while the
            // card is hovered). The flyer then grows from this to exactly 1.0, which is the
            // discard card's size — the spec's 125x175 hand card arriving at 130x180 on the
            // pile, not at some shared "table card" that no longer exists.
            const box = flyerBox();
            const k0 = from.width / (box.w * stage.scale);

            // A quiet clone underneath: 2–3 fading echoes stretched along the path.
            // The impact ring and the sparks are shared single nodes.
            const ghostA = document.createElement('div');
            const ghostB = document.createElement('div');
            const ghostC = document.createElement('div');
            ghostA.className = 'throw-ghost';
            ghostB.className = 'throw-ghost';
            ghostC.className = 'throw-ghost';
            flightLayer.appendChild(ghostA);
            flightLayer.appendChild(ghostB);
            flightLayer.appendChild(ghostC);

            const trail = [];
            paintedThrowKey = '';   // this throw repaints the flyer's face from scratch
            cardThrow = {
                t0: 0, p0, p1, p2, spinDir, tilt0, k0, box, stageW: stage.width,
                letter: cardData.value, color: cardData.color,
                sourceEl: cardElement, onLanded,
                ghostA, ghostB, ghostC, trail, impacted: false,
            };

            // The hand copy is spent at the click — the flyer IS the card now.
            cardElement.remove();

            playCardLaunchWhoosh();

            ensureThrowLoop();
        }

        // One visual frame of the throw. Returns true while it is still running.
        //
        // Every value below is a function of absolute time since the click, never of
        // a frame count, so the throw is the same 0.50s on a 30, 60 or 144Hz panel.
        // The phase boundaries are THROW's; the easings are the edges between them.
        function stepThrow(now) {
            const a = cardThrow;
            if (!a) return false;
            if (!a.t0) a.t0 = now;

            const t = (now - a.t0) / 1000;
            const s = { x: a.p0.x, y: a.p0.y, z: 0, rot: a.tilt0, rx: 0, ry: 0, sx: a.k0, sy: a.k0, dir: 0, blur: 0, speed: 0, color: a.color, letter: a.letter };

            if (t <= THROW.lift) {
                // 0.00-0.08 anticipation: lift + slight scale, fast and small
                const e = easeOutCubic(t / THROW.lift);
                s.x = a.p0.x;
                s.y = a.p0.y - 16 * e;
                s.rot = a.tilt0;
                s.rx = -12 * e;
                s.sx = s.sy = a.k0 * (1 + 0.06 * e);
            } else if (t <= THROW.land) {
                // 0.08-0.30 the throw, 0.30-0.42 the alignment.
                //
                // The path is a quadratic through a control point lifted above both
                // ends and bowed to one side, with easeInOutQuart: hard accel into the
                // middle of the leg, smooth decel on approach. It starts from the
                // LIFTED position (where the anticipation left the card), not the raw
                // hand slot, or the card would snap down 16px at t=0.08.
                const l0 = { x: a.p0.x, y: a.p0.y - 16 };
                const u = (t - THROW.lift) / (THROW.land - THROW.lift);
                const e = easeInOutQuart(u);
                const om = 1 - e;
                s.x = om * om * l0.x + 2 * om * e * a.p1.x + e * e * a.p2.x;
                s.y = om * om * l0.y + 2 * om * e * a.p1.y + e * e * a.p2.y;

                // How far off the table plane the card currently is, 0..1: up through
                // the throw, peaked while it is travelling fastest, and back down to 0
                // exactly at the align boundary — so the card is on the table for the
                // whole of 0.30-0.42 while it squares itself up to the pile. Because it
                // reaches 0 before first contact the landing point stays exact: the
                // perspective on the flight layer only ever foreshortens the card while
                // it is genuinely in the air. The bank rides the same shape, so the lean
                // squares up with the lift instead of snapping flat.
                const uAlign = (THROW.align - THROW.lift) / (THROW.land - THROW.lift);
                const air = Math.sin(Math.min(1, u / uAlign) * Math.PI);
                s.z = air * THROW.arcZ;
                s.ry = air * a.spinDir * 9;

                // spin: ~2 rotations, and ONE continuous curve for them. The card
                // accelerates out of the release, turns at its fastest through the
                // middle of the throw and is at a dead stop exactly at first contact, so
                // the whole of 0.30-0.42 is the card visibly braking into alignment.
                //
                // Deliberately not split at THROW.align into a fast leg and a slow leg:
                // any two curves joined there step the angular velocity at the join
                // (~10.4k°/s down to ~6k°/s is what the first attempt measured), and a
                // step in spin rate at this speed reads as a stutter, not as braking.
                const spinE = easeInOutCubic((t - THROW.lift) / (THROW.land - THROW.lift));
                s.rot = a.tilt0 * (1 - spinE) + a.spinDir * THROW.spin * spinE;

                // the 3D tilt: the card lifts presenting its face (-12°), then eases
                // through the flight to the pile's own 24° table tilt, so the handoff
                // to the placed card is invisible rather than a flat-to-tilted pop
                s.rx = -12 + 36 * e;

                const k = a.k0 + (1 - a.k0) * e;          // grows to table-card size

                // velocity for stretch + blur. Derivatives of the position above,
                // so the stretch peaks exactly when the flight is fastest.
                const dE = (u < 0.5 ? 32 * u * u * u : 32 * Math.pow(1 - u, 3)) / (THROW.land - THROW.lift);
                const vx = 2 * om * (a.p1.x - l0.x) + 2 * e * (a.p2.x - a.p1.x);
                const vy = 2 * om * (a.p1.y - l0.y) + 2 * e * (a.p2.y - a.p1.y);
                const speed = Math.hypot(vx * dE, vy * dE);
                const stretch = Math.min(0.16, speed / 2600);
                s.sx = k * (1 + stretch);
                s.sy = k * (1 - stretch * 0.55);
                s.dir = Math.atan2(vy, vx) * 180 / Math.PI;
                s.speed = speed;
                // A thin blur only. The directional smear is the ghost trail's job; the
                // filter is just the last edge off the fastest frames, kept small enough
                // that the face is still readable while the card is moving.
                s.blur = Math.min(1, Math.max(0, (speed - 700) / 900)) * 1.1;
            } else if (t <= THROW.rest) {
                // 0.42-0.50 impact: one sharp vertical squash-bounce
                if (!a.impacted) { a.impacted = true; throwImpact(a); }
                const u = (t - THROW.land) / (THROW.rest - THROW.land);
                const w = Math.sin(Math.PI * Math.min(1, u));
                s.x = a.p2.x;
                s.y = a.p2.y - 12 * w;
                s.z = 0;
                s.rot = 0;
                s.rx = 24;   // still matched to the pile's table tilt through the bounce
                // squash flat along the hit axis: vertical compress, horizontal spread
                // (the conjugated rotate maps sx onto screen-Y). The hop above already
                // carries the bounce; this is the slap.
                s.dir = 90;
                s.sx = 1 - 0.08 * w;
                s.sy = 1 + 0.10 * w;
            } else {
                return false;   // done — the caller hands the card to the pile
            }

            // Land true: from 0.34 (the last eighth of a second before THROW.land) the
            // painted position eases off the camera pan, so the card meets the pile
            // exactly even while the camera is still drifting home behind it.
            const comp = t < 0.34 ? 0 : Math.min(1, (t - 0.34) / 0.08);
            s.x -= throwCameraX * comp;
            s.y -= throwCameraY * comp;
            paintThrowCard(s);

            // Ghost trail during the fast middle of the flight. Gated on SPEED rather
            // than on the filter's blur radius, so the two can be tuned separately:
            // the smear is what sells the speed now, and the filter is only a hint.
            a.trail.push({ x: s.x, y: s.y, z: s.z, rot: s.rot, rx: s.rx, ry: s.ry, on: t > THROW.lift && t < THROW.land && s.speed > 900 });
            if (a.trail.length > 64) a.trail.shift();
            const n = a.trail.length;
            paintThrowGhost(a.ghostA, a.trail[Math.max(0, n - 3)], a.color, a.letter, 0.26);
            paintThrowGhost(a.ghostB, a.trail[Math.max(0, n - 6)], a.color, a.letter, 0.15);
            paintThrowGhost(a.ghostC, a.trail[Math.max(0, n - 9)], a.color, a.letter, 0.07);

            // camera: ease toward the midpoint of the travel, never toward the card
            // itself, then back to rest on impact
            if (t > THROW.lift && t <= THROW.land) {
                // The board's OWN dimensions, not the viewport's and not the spec's
                // 1920: on a phone the board is wider than 1920 so that it can reach the
                // sides, and the camera pans across the board it is drawn on.
                const lookX = (s.x + a.p2.x) / 2 - a.stageW / 2;
                const lookY = (s.y + a.p2.y) / 2 - STAGE_H * 0.55;
                throwCameraTX = Math.min(9, Math.max(-9, -lookX * 0.07));
                throwCameraTY = Math.min(7, Math.max(-7, -lookY * 0.07));
            } else {
                throwCameraTX = 0;
                throwCameraTY = 0;
            }
            return true;
        }

        // What the flyer's face is currently painted with. The card only changes
        // colour and letter at the click, so the class and the span are written once
        // per throw rather than rebuilt every frame — one less reflow inside the
        // frame that has to stay clean.
        let paintedThrowKey = '';

        function paintThrowCard(s) {
            const el = document.getElementById('throw-flight-card');
            if (!el) return;
            const key = s.color + '|' + s.letter;
            if (key !== paintedThrowKey) {
                paintedThrowKey = key;
                el.className = 'discarded-card ' + s.color;
                el.textContent = '';
                const v = document.createElement('span');
                v.className = 'card-value';
                v.textContent = s.letter;
                el.appendChild(v);
            }
            el.style.opacity = '1';
            el.style.filter = s.blur > 0.05 ? `blur(${s.blur.toFixed(2)}px)` : 'none';
            // z carries the card off the table plane and back. rotateX/rotateY are
            // applied last, so they tilt the card in its own frame and are then
            // projected by the flight layer's perspective — a real lean rather than
            // the flat squash the same angles give without one.
            //
            // The half-box offsets are the flyer's OWN half-width and half-height, not
            // the 52.5/79 of a 105x158 card: every operation here is about the box
            // centre, so translating by the true half-size is what puts that centre on
            // the curve. Hard-coding the old numbers would have landed a 130x180 card
            // 9px right and 11px low of the pile.
            const box = (cardThrow && cardThrow.box) || { w: 105, h: 158 };
            const hw = box.w / 2, hh = box.h / 2;
            el.style.transform =
                `translate3d(${(s.x - hw).toFixed(1)}px, ${(s.y - hh).toFixed(1)}px, ${s.z.toFixed(1)}px)` +
                ` rotate(${s.dir.toFixed(2)}deg) scale(${s.sx.toFixed(4)}, ${s.sy.toFixed(4)}) rotate(${(-s.dir).toFixed(2)}deg)` +
                ` rotate(${s.rot.toFixed(2)}deg) rotateX(${s.rx.toFixed(2)}deg) rotateY(${s.ry.toFixed(2)}deg)`;
        }

        // The echoes inherit the sample's z and its tilt, so the smear lies in the
        // same plane the card is in instead of reading as flat stickers dragged
        // behind it. Faces are only rewritten when they actually change.
        function paintThrowGhost(ghost, sample, color, letter, opacity) {
            if (!ghost) return;
            if (!sample || !sample.on) { ghost.style.opacity = '0'; return; }
            if (ghost.dataset.paint !== color) {
                ghost.dataset.paint = color;
                ghost.className = 'throw-ghost ' + color;
                ghost.textContent = letter;
            }
            ghost.style.opacity = String(opacity);
            // Same half-box offsets as the flyer, from the same box: the echoes have to
            // sit on the flyer's centre or the smear trails off it.
            const box = (cardThrow && cardThrow.box) || { w: 105, h: 158 };
            ghost.style.transform =
                `translate3d(${(sample.x - box.w / 2).toFixed(1)}px, ${(sample.y - box.h / 2).toFixed(1)}px, ${sample.z.toFixed(1)}px)` +
                ` rotate(${sample.rot.toFixed(1)}deg) rotateX(${sample.rx.toFixed(1)}deg) rotateY(${sample.ry.toFixed(1)}deg)`;
        }

        // ONE loop drives the whole system — card, sparks, camera — so a throw
        // fired while the previous one's sparks are still airborne cannot fork the
        // frame callbacks and double-step the particles.
        let throwLoopRunning = false;
        let throwLastFrame = 0;
        function ensureThrowLoop() {
            if (throwLoopRunning) return;
            throwLoopRunning = true;
            throwLastFrame = 0;
            requestAnimationFrame(throwLoop);
        }

        function throwLoop(now) {
            const running = stepThrow(now);
            // The card phase just ended: hand it to the pile exactly once. The loop
            // keeps running past this point for the sparks and the camera return.
            if (!running && cardThrow) finishThrow();

            // Real frame time, clamped. The card is already a pure function of the
            // clock; the sparks and the camera pan now are too, so the burst falls at
            // the same speed on a 144Hz panel as on a 60Hz one, and a tab that was
            // backgrounded mid-throw does not teleport them through the floor.
            let dt = throwLastFrame ? (now - throwLastFrame) / 1000 : 1 / 60;
            throwLastFrame = now;
            dt = Math.min(0.05, Math.max(0.001, dt));

            // sparks and the camera run on the same loop, even after the card stops
            for (let i = throwSparks.length - 1; i >= 0; i--) {
                const sp = throwSparks[i];
                sp.t += dt;
                if (sp.t >= sp.life) { sp.el.remove(); throwSparks.splice(i, 1); continue; }
                sp.vy += 620 * dt;
                sp.x += sp.vx * dt;
                sp.y += sp.vy * dt;
                const k = 1 - sp.t / sp.life;
                sp.el.style.opacity = String(k * k);
                // rendered in world space minus the live camera pan, so the burst stays
                // glued to the pile while the camera eases home behind it — the same
                // convention the flying card paints itself with
                sp.el.style.transform = `translate3d(${(sp.x - throwCameraX).toFixed(1)}px, ${(sp.y - throwCameraY).toFixed(1)}px, 0) scale(${(0.5 + k * 0.8).toFixed(3)})`;
            }

            // The follow lerp as an exponential in seconds. The old per-frame 0.224
            // was tuned at 60Hz and ran twice as fast at 120; this is the same feel
            // at every refresh rate, and it is why the camera settles rather than
            // snapping back when the card stops.
            const kp = 1 - Math.exp(-THROW.cameraLag * dt);
            throwCameraX += (throwCameraTX - throwCameraX) * kp;
            throwCameraY += (throwCameraTY - throwCameraY) * kp;
            const rig = document.getElementById('throw-camera-rig');
            if (rig) {
                rig.style.transform = `translate3d(${throwCameraX.toFixed(2)}px, ${throwCameraY.toFixed(2)}px, 0)`;
            }

            if (running || throwSparks.length || Math.abs(throwCameraX - throwCameraTX) > 0.02 || Math.abs(throwCameraY - throwCameraTY) > 0.02) {
                requestAnimationFrame(throwLoop);
            } else {
                // Park it EXACTLY, rather than a hundredth of a pixel short. An
                // exponential approach never reaches its target, so the loop above stops
                // while the rig is still holding a transform — and a rig left a fraction
                // of a pixel off rest is one thrown card away from a visible twitch at
                // the start of the next one. Snapping here costs one write and leaves the
                // camera provably at the normal gameplay position.
                throwCameraX = throwCameraTX;
                throwCameraY = throwCameraTY;
                if (rig) {
                    rig.style.transform = `translate3d(${throwCameraX.toFixed(2)}px, ${throwCameraY.toFixed(2)}px, 0)`;
                }
                throwLoopRunning = false;
            }
        }

        function throwImpact(a) {
            // the snap sound — moved here from the click handler
            playCardSlamSound();

            // the pile reacts: the same tiny physical hit the zone used to give itself
            const centerZone = document.getElementById('center-board-zone');
            if (centerZone) {
                centerZone.classList.remove('impact');
                void centerZone.offsetWidth;
                centerZone.classList.add('impact');
                setTimeout(() => centerZone.classList.remove('impact'), 130);
            }

            // ...and the card UNDER the hit shrugs it off: a couple of pixels of sink
            // and a degree of twist, gone in under a fifth of a second. The flyer is
            // still in the air at this point in the timeline — it is only appended to
            // the pile at 0.50 — so the last child is still the previous top card.
            const pileNode = document.getElementById('discard-deck-pile');
            const underCard = pileNode ? pileNode.lastElementChild : null;
            if (underCard) {
                underCard.classList.remove('pile-recoil');
                void underCard.offsetWidth;
                underCard.classList.add('pile-recoil');
            }

            // ring + sparks at the landing point. The ring is placed through the
            // same camera compensation as the card, so burst and card coincide on
            // screen in this exact frame (both read the pan before this frame's
            // lerp runs — one more reason the camera update comes after stepThrow).
            const ring = document.getElementById('throw-impact-ring');
            if (ring) {
                ring.style.left = (a.p2.x - throwCameraX) + 'px';
                ring.style.top = (a.p2.y - throwCameraY) + 'px';
                ring.classList.remove('go');
                void ring.offsetWidth;
                ring.classList.add('go');
            }
            const flightLayer = document.getElementById('throw-flight-layer');
            const sparkColors = ['#ffffff', '#ffcc00', '#00ffcc', '#ff1744', '#ffffff'];
            for (let i = 0; i < 12; i++) {
                const el = document.createElement('div');
                el.className = 'throw-spark';
                const size = 5 + Math.random() * 7;
                el.style.width = el.style.height = size + 'px';
                el.style.background = sparkColors[i % sparkColors.length];
                el.style.boxShadow = `0 0 8px ${sparkColors[i % sparkColors.length]}`;
                flightLayer.appendChild(el);
                const ang = Math.random() * Math.PI * 2;
                const speed = 70 + Math.random() * 160;
                throwSparks.push({ el, x: a.p2.x, y: a.p2.y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed - 90, life: 0.30 + Math.random() * 0.16, t: 0 });
            }

            // a tiny camera recoil impulse — the follow lerp absorbs it into the
            // return-to-rest, so it reads as weight and not as shake
            throwCameraX += Math.min(4, Math.max(-4, (a.p2.x - a.stageW / 2) * 0.02));
            throwCameraY += 3.5;
        }

        function finishThrow() {
            const a = cardThrow;
            cardThrow = null;
            if (!a) return;
            a.ghostA.remove();
            a.ghostB.remove();
            a.ghostC.remove();
            const flightCard = document.getElementById('throw-flight-card');
            if (flightCard) { flightCard.style.opacity = '0'; flightCard.style.filter = 'none'; }
            a.onLanded();   // the original pile-append + effects run here, unchanged
        }

        // Simulates localized card play animations moving toward discard pile
        function executeLocalCardPlay(cardData, cardElement) {
            const discardPile = document.getElementById('discard-deck-pile');
            const centerZone = document.getElementById('center-board-zone');
            if (!discardPile || !centerZone) return;

            // One throw at a time: a second click during a throw just lands it fast,
            // so the pile can never receive two cards for one click.
            if (cardThrow) finishThrow();

            // Generate realistic chaotic positioning values for table messiness
            const randomRot = (Math.random() * 24) - 12;
            const randomX = (Math.random() * 10) - 5;
            const randomY = (Math.random() * 10) - 5;

            const placedCard = document.createElement('div');
            placedCard.classList.add('discarded-card', cardData.color);
            placedCard.style.setProperty('--discard-rot', `${randomRot}deg`);
            placedCard.style.setProperty('--discard-x', `${randomX}px`);
            placedCard.style.setProperty('--discard-y', `${randomY}px`);
            placedCard.style.setProperty('--discard-z', `${discardPile.children.length * 2}px`);

            const valueEl = document.createElement('span');
            valueEl.classList.add('card-value');
            valueEl.innerText = cardData.value;
            placedCard.appendChild(valueEl);

            const landOnPile = () => {
                discardPile.appendChild(placedCard);
                // the 0.50-0.65 settle: the card drops the last few pixels into the
                // stack while the camera drifts home behind it
                placedCard.classList.add('landed-settle');
                const cardEffect = cardData.type
                    || (cardData.value === 'W' ? 'wild' : cardData.value === 'S' ? 'skip' : 'other');
                if (cardEffect === 'wild') {
                    playWildCardSound();
                    triggerScreenFlash('effect-wild');
                    awaitingWildCard = placedCard;
                    presentColorPickerWheel();
                } else if (cardEffect === 'skip') {
                    playSkipCardSound();
                    triggerScreenFlash('effect-skip');
                }
                if (!document.querySelectorAll('.hand-container .card').length) {
                    finishRoundLocally();
                }
            };

            if (cardElement && cardElement.isConnected) {
                throwCardVisual(cardData, cardElement, landOnPile);
            } else {
                landOnPile();
            }
        }

        // Updates red stack counter widgets for opponent seating boundaries
        function updateOpponentCounters(slotKey, countNumber) {
            const targetStack = document.getElementById(`count-stack-${slotKey}`);
            if (!targetStack) return;
            targetStack.innerHTML = '';

            // A plain number on the green strip. It used to build one little card per
            // digit; the mockup shows a number, which reads faster and cannot be mistaken
            // for a playable card. Same input and same seat lookup, so the deal, the
            // penalty and the round reset all keep working without changes.
            targetStack.textContent = String(Math.max(0, Number(countNumber) || 0));
        }

        /**
         * ENEMY MECHANIC: Generates masked card backs for an enemy seat.
         *
         * A fan of face-down cards, one per card the seat is holding, so a seat shows a
         * hand rather than a bare digit. The count is the only thing it is given — which
         * is the whole point of a card back: the page knows how many cards are there and
         * nothing about what they are.
         *
         * @param {string} slotKey - Seating key suffix: 'left' or 'right'
         * @param {number} totalCardsInHand - How many backs to fan out
         */
        function renderHiddenEnemyFanStack(slotKey, totalCardsInHand) {
            const fanTray = document.getElementById(`fan-hand-${slotKey}`);
            if (!fanTray) return;
            fanTray.innerHTML = '';

            const count = Math.max(0, Math.min(20, Number(totalCardsInHand) || 0));
            const isLeft = slotKey === 'left';

            for (let i = 0; i < count; i += 1) {
                const backCard = document.createElement('div');
                backCard.classList.add('card', 'card-back');
                backCard.style.position = 'absolute';

                // A diagonal cascade running down and inward, tilting a little further with
                // every card, so the two enemy tracks bracket the table the way the target
                // mockup has them instead of sitting in flat rows. The tray is deliberately
                // narrower and shorter than the cascade: the backs overflow it rather than
                // widening the seat and dragging its portrait away from the rim.
                const direction = isLeft ? 1 : -1;

                // The spec's side seats: 85x137 backs (65x105 x1.3), 29px apart across
                // and 39px down, so the fan cascades diagonally inward and every card
                // keeps a ~56px strip of its neighbour — the same fraction of the card as
                // the 43px strip of a 65px back that the spec's band describes. The
                // card's own size is --side-card-* in the sheet; these are the steps.
                //
                // The faces are SMALLER than the player's and the partner's, and that is
                // the spec's visual hierarchy rather than the uniformity this used to
                // have: your hand is the biggest thing on the table, the side seats are
                // the smallest, the top seat sits between them.
                backCard.style.top = `${i * 39}px`;
                backCard.style.left = `calc(50% + ${direction * i * 29}px)`;
                backCard.style.transform =
                    `translate3d(-50%, 0, 0) rotate(${direction * (18 + i * 2)}deg)`;
                backCard.style.zIndex = i;

                fanTray.appendChild(backCard);
            }
        }

        /**
         * TEAM MECHANIC: Renders the partner's hand face up across the top seat.
         *
         * Same card, same size, same fan as the local hand — the only difference is which
         * seat it is drawn on. Seven cards at a 32px spread come to 297px, which is what
         * the 380px rack on that seat is for.
         *
         * @param {Array} cardsArray - The partner's cards, faces and all
         */
        function renderTeammateHandFaceUp(cardsArray) {
            const container = document.getElementById('teammate-hand-container');
            if (!container) return;
            container.innerHTML = '';

            const cards = Array.isArray(cardsArray) ? cardsArray : [];
            const midIndex = (cards.length - 1) / 2;

            cards.forEach((card, i) => {
                const cardEl = document.createElement('div');
                cardEl.className = `card ${card.color || 'blue'}`;
                cardEl.style.position = 'absolute';

                // Fans cards sideways and slightly down at the edges, the same arc the
                // local hand uses so a partner's hand reads as the same kind of object.
                // The spec's top seat: 137x195 cards (105x150 x1.3) at a 65px spread —
                // 50px x1.3, the same fraction of the card as before — so seven of them
                // come to 527px, which is exactly what .opponent-top-hand is sized to. A
                // wider spread would outgrow the rack and a tighter one would hide the
                // corner indices.
                const offsetFromMiddle = i - midIndex;
                const horizontalSpread = offsetFromMiddle * 65;
                const rotationAngle = offsetFromMiddle * 4;
                const verticalDip = Math.abs(offsetFromMiddle) * 5;

                cardEl.style.left = `calc(50% + ${horizontalSpread}px)`;
                cardEl.style.transform = `translate3d(-50%, 0, 0) translateY(${verticalDip}px) rotate(${rotationAngle}deg)`;
                cardEl.style.zIndex = i;

                const valueClass = (card.isAction || String(card.value ?? '').length > 1)
                    ? 'card-value action-symbol' : 'card-value';

                cardEl.innerHTML = `
                    <div class="corner-value corner-top-left">${card.value}</div>
                    <div class="${valueClass}">${card.value}</div>
                    <div class="corner-value corner-bottom-right">${card.value}</div>
                `;

                container.appendChild(cardEl);
            });
        }

        /** Draws both enemy fans and their counts from one source of truth. */
        function paintSeatHands() {
            ['left', 'right'].forEach((slotKey) => {
                const counterKey = `opponent-${slotKey}`;
                const held = opponentHandSize[counterKey] ?? 7;
                updateOpponentCounters(counterKey, held);
                renderHiddenEnemyFanStack(slotKey, held);
            });
        }

        // Activates the neon direction arrow tracing system around game board
        function highlightTurnIndicator(activeSlotKey) {
            document.querySelectorAll('.direction-arrow').forEach(arrow => {
                arrow.classList.remove('active-turn');
            });
            const targetArrow = document.getElementById(`arrow-${activeSlotKey}`);
            if (targetArrow) {
                targetArrow.classList.add('active-turn');
            }

            // The same turn, shown on the seat itself: a neon ring around the portrait
            // whose turn it is. Driven from this one function so the arrow and the ring
            // can never disagree about whose turn it is — a second indicator is worth
            // having, a second source of truth is not.
            document.querySelectorAll('.avatar-hud-wrapper').forEach((wrapper) => {
                wrapper.classList.remove('active-turn');
            });
            const seatNode = document.getElementById(
                activeSlotKey === 'local-player' ? 'slot-local-player' : `slot-${activeSlotKey}`
            );
            const seatWrapper = seatNode ? seatNode.querySelector('.avatar-hud-wrapper') : null;
            if (seatWrapper) {
                seatWrapper.classList.add('active-turn');
            }
        }

        // Cinematic 3D Round Deal Animation matrix sequence loops
        function initializeCinematic3DDeal(playersList, finalHandData) {
            const tableCanvas = document.querySelector('.game-table');
            const deckAnchor = document.getElementById('central-deck');
            if (!deckAnchor || !tableCanvas) return;

            const deckBounds = deckAnchor.getBoundingClientRect();
            const deckX = deckBounds.left + deckBounds.width / 2;
            const deckY = deckBounds.top + deckBounds.height / 2;

            const seatingMap = {
                'opponent-left': document.getElementById('slot-opponent-left'),
                'opponent-top': document.getElementById('slot-opponent-top'),
                'opponent-right': document.getElementById('slot-opponent-right'),
                'local-player': document.getElementById('local-player-hand')
            };

            const fullDealPipeline = [];
            const cardsPerHand = 7;

            for (let round = 0; round < cardsPerHand; round++) {
                playersList.forEach(p => {
                    fullDealPipeline.push({ playerId: p.id, positionKey: p.tableSlotPosition });
                });
            }

            const frameIntervalRate = 220; // Paced deployment rate for legibility

            fullDealPipeline.forEach((task, index) => {
                setTimeout(() => {
                    const targetElement = seatingMap[task.positionKey];
                    if (!targetElement) return;

                    const destBounds = targetElement.getBoundingClientRect();
                    const targetX = destBounds.left + destBounds.width / 2;
                    const targetY = destBounds.top + destBounds.height / 2;

                    const flightCard = document.createElement('div');
                    flightCard.classList.add('card-in-flight');
                    flightCard.style.setProperty('--deck-x', `${deckX}px`);
                    flightCard.style.setProperty('--deck-y', `${deckY}px`);

                    // Generate random mid-air 3D rotation angles
                    const rotX = (Math.random() * 40) - 20;
                    const rotY = (Math.random() * 60) - 30;
                    const rotZ = (Math.random() * 40) - 20;

                    flightCard.style.setProperty('--target-x', `${targetX}px`);
                    flightCard.style.setProperty('--target-y', `${targetY}px`);
                    flightCard.style.setProperty('--target-z', '150px');
                    flightCard.style.setProperty('--rot-x', `${rotX}deg`);
                    flightCard.style.setProperty('--rot-y', `${rotY}deg`);
                    flightCard.style.setProperty('--rot-z', `${rotZ}deg`);

                    tableCanvas.appendChild(flightCard);

                    requestAnimationFrame(() => {
                        flightCard.classList.add('thrown');
                    });

                    playCardRuffleSound();

                    setTimeout(() => {
                        flightCard.remove();
                    }, 560);

                }, index * frameIntervalRate);
            });

            // Cleanly paint active interactions upon deal compilation conclusion
            setTimeout(() => {
                renderHand(finalHandData);
                // Initialize default counters, and the hidden-hand fans beside them.
                // The two side seats share one source of truth via paintSeatHands, so a
                // seat's digit and its card backs can never drift apart.
                paintSeatHands();
                // The top seat is the partner, so its hand is dealt open instead of being
                // counted. It has no count stack to fill any more — seven readable cards
                // are their own number.
                renderTeammateHandFaceUp(teammateHandMock);
                highlightTurnIndicator('local-player');
                startTurnClockSimulation();
            }, (fullDealPipeline.length * frameIntervalRate) + 300);
        }

        // Simulated local game round countdown sound ticker clock loop
        function startTurnClockSimulation() {
            let ticksLeft = 15;
            activeTimerInterval = setInterval(() => {
                ticksLeft--;
                if (ticksLeft <= 0) {
                    clearInterval(activeTimerInterval);
                    return;
                }
                playTimerTickSound(ticksLeft <= 5);
            }, 1000);
        }

        // ---- the match clock --------------------------------------------------
        // Counts down in MM:SS from the round's total. It stops at 00:00 and stays
        // there rather than looping, so a demo left open settles on zero.
        let gameMatchTimerInterval = null;

        function initializeArcadeMatchTimer(startingSecondsTotal) {
            clearInterval(gameMatchTimerInterval);

            let currentTimerSeconds = startingSecondsTotal;
            const displayNode = document.getElementById('game-countdown-string');

            const paintClock = () => {
                if (!displayNode) return;
                const minutes = Math.floor(currentTimerSeconds / 60).toString().padStart(2, '0');
                const seconds = (currentTimerSeconds % 60).toString().padStart(2, '0');
                displayNode.innerText = `${minutes}:${seconds}`;
            };

            paintClock();

            gameMatchTimerInterval = setInterval(() => {
                currentTimerSeconds -= 1;
                if (currentTimerSeconds <= 0) {
                    currentTimerSeconds = 0;
                    paintClock();
                    clearInterval(gameMatchTimerInterval);
                    return;
                }
                paintClock();
            }, 1000);
        }

        // ---- chat -------------------------------------------------------------
        // There is no socket in this page, so nothing is sent anywhere. A canned
        // message pops a speech bubble over the local shelf, and an emoji floats up
        // out of the trigger. The networked client is the one that would transmit.
        function openChatInterface() {
            const tray = document.getElementById('chat-selection-tray');
            const trigger = document.getElementById('chat-trigger');
            if (!tray) return;
            const nowOpen = tray.classList.toggle('active-tray');
            if (trigger) {
                trigger.classList.toggle('open', nowOpen);
                trigger.setAttribute('aria-expanded', String(nowOpen));
            }
        }

        function closeChatTray() {
            const tray = document.getElementById('chat-selection-tray');
            const trigger = document.getElementById('chat-trigger');
            if (!tray || !tray.classList.contains('active-tray')) return;
            tray.classList.remove('active-tray');
            if (trigger) {
                trigger.classList.remove('open');
                trigger.setAttribute('aria-expanded', 'false');
            }
        }

        // Settings, top right. The spec asks for a gear button and stops there; a button
        // that does nothing when tapped is worse than no button, and sound is the only
