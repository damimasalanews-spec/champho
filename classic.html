<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Champ Word Classic</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061827;font-family:Inter,Arial,sans-serif;color:#fff}body{display:grid;place-items:center}#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;overflow:hidden}#sceneBg,#classicTableScene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}#sceneBg{z-index:0}#stage:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(4,17,28,.16),transparent 35%,rgba(2,10,18,.22))}#classicTableScene{z-index:5;pointer-events:none}.header{position:absolute;z-index:30;left:34px;right:34px;top:24px;height:58px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:34px;font-weight:1000;font-style:italic;text-shadow:0 3px 0 #000}.mode,.pill{background:rgba(3,34,53,.82);border:1px solid rgba(99,220,255,.6);box-shadow:0 5px 16px rgba(0,0,0,.3)}.mode{margin-left:12px;padding:8px 18px;border-radius:18px;font-weight:900}.headRight{display:flex;gap:10px;align-items:center}.pill{padding:10px 18px;border-radius:24px;font-weight:900;white-space:nowrap}.players{position:absolute;inset:0;z-index:15}.player{position:absolute;display:flex;align-items:center;gap:10px;text-shadow:0 2px 6px #000}.avatar{width:96px;height:96px;border-radius:50%;padding:4px;background:conic-gradient(#ffe44d,#25d9ff,#ffdc3d,#25d9ff,#ffe44d);box-shadow:0 0 0 4px rgba(3,31,47,.9),0 0 22px rgba(53,220,255,.55),0 10px 22px rgba(0,0,0,.5)}.avatar div{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:#0b78ad;font-size:38px}.meta{min-width:145px;padding:8px 12px;border-radius:13px;background:rgba(3,39,60,.86);border:1px solid rgba(74,213,255,.72)}.name{font-size:20px;font-weight:1000;white-space:nowrap}.score{margin-top:4px;color:#ffd85b;font-size:16px;font-weight:900}.p0{left:300px;top:92px}.p1{left:20px;top:300px}.p2{left:1080px;top:105px}.p2 .meta{order:2}.p2 .avatar{order:1}.empty{opacity:.55}.side{position:absolute;z-index:25;left:24px;top:575px;display:flex;flex-direction:column;gap:12px}.react{width:58px;height:58px;border-radius:50%;border:1px solid #43d8ff;background:rgba(3,50,78,.88);color:#fff;font-size:25px}.chat{position:absolute;z-index:25;right:24px;top:575px;width:350px;height:255px;border-radius:20px;padding:15px;background:rgba(3,25,43,.93);border:1px solid #4ad5ff;box-shadow:0 15px 30px rgba(0,0,0,.38);display:flex;flex-direction:column}.chat h3{margin:0 0 10px;color:#73e9ff;font-size:15px;display:flex;justify-content:space-between}.msgs{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:7px}.msg{padding:7px 9px;border-radius:10px;background:rgba(8,57,86,.75);font-size:12px}.msg b{color:#ffd85b}.chatInput{display:flex;gap:7px;margin-top:10px}.chatInput input{flex:1;min-width:0;border:1px solid #55d7ff;border-radius:17px;background:#041b2d;color:#fff;padding:8px 10px}.send{width:42px;border:0;border-radius:17px;background:#0b79ba;color:#fff}.bottom{position:absolute;z-index:25;left:430px;bottom:42px;width:740px;height:170px;padding:12px 18px;border-radius:20px;background:rgba(3,25,43,.92);border:1px solid #4ad5ff;box-shadow:0 15px 30px rgba(0,0,0,.42);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px}.hand{display:flex;align-items:flex-end;height:72px;max-width:700px;overflow:hidden}.letter{width:46px;height:58px;margin-left:-5px;border-radius:10px;border:2px solid #58d8ff;background:linear-gradient(180deg,#159be6,#0758a5);color:#fff;font-size:25px;font-weight:1000;box-shadow:0 8px 18px rgba(0,0,0,.32);cursor:pointer}.letter:first-child{margin-left:0}.letter.selected{transform:translateY(-9px);filter:brightness(1.22)}.actions{display:flex;gap:10px}.action{height:38px;padding:0 22px;border-radius:20px;border:1px solid #58dcff;background:rgba(7,73,112,.92);color:#fff;font-weight:1000;cursor:pointer}.submit{background:#0ca66e}.status{position:absolute;z-index:40;left:50%;top:95px;transform:translateX(-50%);padding:7px 15px;border-radius:16px;background:rgba(3,25,43,.85);border:1px solid #4ad5ff;font-size:13px;font-weight:900}.status.bad{border-color:#ff7070}.room{cursor:pointer}@media(max-width:900px) and (orientation:portrait){body{display:none!important}}@media(orientation:landscape) and (max-height:720px){.header{left:24px;right:24px;top:16px}.brand{font-size:30px}.avatar{width:88px;height:88px}.p0{left:285px;top:82px}.p1{left:16px;top:290px}.p2{left:1090px;top:94px}.side{left:18px;top:560px}.chat{right:18px;top:565px;width:340px;height:245px}.bottom{left:415px;bottom:34px;width:650px;height:155px}.letter{width:42px;height:54px;font-size:23px}}
</style></head><body><div id="stage"><img id="sceneBg" src="classic-bg/classic-scene-hd.webp"><img id="classicTableScene" src="classic-bg/classic-table-scene.webp"><header class="header"><div><span class="brand">CHAMP WORD</span><span class="mode">CLASSIC</span></div><div class="headRight"><span class="pill" id="roundPill">WAITING</span><span class="pill room" id="roomPill">ROOM —</span><span class="pill">🪙 <b id="coins">0</b></span></div></header><div class="status" id="status">Connecting…</div><div class="players"><div class="player p0" id="p0"><div class="avatar"><div>😀</div></div><div class="meta"><div class="name">Waiting…</div><div class="score">🪙 0</div></div></div><div class="player p1" id="p1"><div class="avatar"><div>🙂</div></div><div class="meta"><div class="name">Waiting…</div><div class="score">🪙 0</div></div></div><div class="player p2" id="p2"><div class="avatar"><div>😎</div></div><div class="meta"><div class="name">Waiting…</div><div class="score">🪙 0</div></div></div></div><div class="side"><button class="react">🙂</button><button class="react">🎁</button><button class="react">💬</button></div><aside class="chat"><h3><span>LIVE CHAT</span><span id="count">• 0</span></h3><div class="msgs" id="msgs"></div><div class="chatInput"><input id="chatInput" placeholder="Type a message…"><button class="send" id="send">➤</button></div></aside><div class="bottom"><div class="hand" id="hand"></div><div class="actions"><button class="action" id="shuffle">↝ SHUFFLE</button><button class="action submit" id="submit">✓ SUBMIT</button></div></div></div><script>
(()=>{const $=id=>document.getElementById(id);let vv=window.visualViewport;function fit(){const w=vv?vv.width:innerWidth,h=vv?vv.height:innerHeight;document.documentElement.style.setProperty('--s',Math.min(w/1600,h/900))}addEventListener('resize',fit,{passive:true});vv?.addEventListener('resize',fit,{passive:true});fit();
const key='champword.playerId';let playerId=localStorage.getItem(key);if(!playerId){playerId=crypto.randomUUID();localStorage.setItem(key,playerId)}const qs=new URLSearchParams(location.search);let roomId=qs.get('room');let ws;let snapshot=null;let hand=[];let selected=new Set();let req=0;const status=$('status');const log=(m,bad=false)=>{status.textContent=m;status.classList.toggle('bad',bad)};const rid=()=>`r${Date.now()}-${++req}`;
function renderPlayers(){if(!snapshot)return;snapshot.players.slice(0,3).forEach((p,i)=>{const el=$('p'+i);el.querySelector('.name').textContent=p.playerId===playerId?'You':p.playerId.slice(0,10);el.querySelector('.score').textContent='🪙 '+p.score;el.classList.remove('empty')});for(let i=snapshot.players.length;i<3;i++){$('p'+i).classList.add('empty');$('p'+i+' .name').textContent='Waiting…';$('p'+i+' .score').textContent='🪙 0'}$('roundPill').textContent=`ROUND ${snapshot.roundNumber} · ${snapshot.phase.toUpperCase()}`;$('roomPill').textContent='ROOM '+snapshot.roomId.slice(0,8)}
function renderHand(){const root=$('hand');root.innerHTML='';hand.forEach(c=>{const b=document.createElement('button');b.className='letter'+(selected.has(c.cardId)?' selected':'');b.textContent=c.value.toUpperCase();b.onclick=()=>{selected.has(c.cardId)?selected.delete(c.cardId):selected.add(c.cardId);renderHand()};root.appendChild(b)})}
const BACKEND_HOST='champword-backend.onrender.com';function backendSocketUrl(){const h=location.hostname;if(h===BACKEND_HOST||h==='localhost'||h==='127.0.0.1'){const proto=location.protocol==='https:'?'wss':'ws';return `${proto}://${location.host}`}return `wss://${BACKEND_HOST}`}
function connect(){ws=new WebSocket(backendSocketUrl());ws.onopen=()=>{log('Connected');if(roomId){ws.send(JSON.stringify({type:'join_room',roomId,playerId}))}else{ws.send(JSON.stringify({type:'create_room',playerId}))}};ws.onclose=()=>log('Disconnected — reconnecting',true);ws.onerror=()=>log('WebSocket error',true);ws.onmessage=async e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='server_ready')return;if(m.type==='error'){log(m.code,true);return}if(m.type==='room_snapshot'){snapshot=m;roomId=m.roomId;if(!qs.get('room'))history.replaceState(null,'',`?room=${roomId}`);renderPlayers();if(m.players.length<2)log('Share the ROOM code with player 2');else{log('2 players connected');if(m.players[0]?.playerId===playerId&&m.phase==='waiting')ws.send(JSON.stringify({type:'start_round',requestId:rid()}))}return}if(m.type==='hand_sync'){hand=m.hand||[];selected.clear();renderHand();log(`Your private hand: ${hand.length} cards`);return}if(m.type==='word_submission_result'){if(m.status==='accepted')log('Accepted ✓');else log(m.reason,true);if(m.handChanged)renderHand();return}if(m.type==='event'){if(m.eventType==='player_joined')log('Player joined ✓');return}if(m.type==='round_completed'){log('Round completed ✓');return}}}connect();
$('shuffle').onclick=()=>{hand=[...hand].sort(()=>Math.random()-.5);renderHand()};$('submit').onclick=()=>{if(!snapshot||selected.size===0||!ws||ws.readyState!==1)return;const cards=hand.filter(c=>selected.has(c.cardId));const word=cards.map(c=>c.value).join('');ws.send(JSON.stringify({type:'submit_word',requestId:rid(),roomId:snapshot.roomId,roundNumber:snapshot.roundNumber,turnNumber:snapshot.turnNumber,cards:cards.map(c=>c.cardId),word}));selected.clear()};$('roomPill').onclick=async()=>{if(roomId)await navigator.clipboard?.writeText(`${location.origin}${location.pathname}?room=${roomId}`);log('Room link copied')};$('send').onclick=()=>{const v=$('chatInput').value.trim();if(v){const d=document.createElement('div');d.className='msg';d.textContent='You: '+v;$('msgs').appendChild(d);$('chatInput').value=''}};document.querySelectorAll('.react').forEach(b=>b.onclick=()=>log('Reaction '+b.textContent));})();
</script></body></html>
