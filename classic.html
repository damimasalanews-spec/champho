<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Champ Word Classic</title>
<style>
/* ===========================================================================
   CHAMP WORD — Classic client
   One logical stage of exactly 1600x900, scaled uniformly by a single
   transform. Nothing inside sizes itself from the viewport, so the artwork can
   never stretch and the layout can never drift out of proportion.
   =========================================================================== */
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061827;
  font-family:Inter,-apple-system,"Segoe UI",Arial,sans-serif;color:#fff}
/* Uniform scaling means a viewport that is not exactly 16:9 must letterbox.
   Instead of letting that read as a grey band around the game, the same scene
   art is bled across the whole viewport behind the stage, blurred and dimmed,
   so the "margin" looks like part of the room. */
#bleed{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:url(classic-bg/classic-scene-hd.webp) center/cover no-repeat;
  filter:blur(18px) brightness(.5) saturate(.85);transform:scale(1.1)}
#stage{position:absolute;z-index:1;left:50%;top:50%;width:1600px;height:900px;
  transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center;overflow:hidden}

/* --- art layers: static art underneath, all interactive UI above it -------- */
#sceneBg,#tableScene{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;object-position:center;display:block}
#sceneBg{z-index:0}
#stage::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(4,17,28,.20),transparent 34%,rgba(2,10,18,.30))}
#tableScene{z-index:2;pointer-events:none}

/* --- header --------------------------------------------------------------- */
.header{position:absolute;z-index:30;left:32px;right:32px;top:16px;height:60px;
  display:flex;align-items:center;justify-content:space-between}
.brand{font-size:36px;font-weight:900;font-style:italic;text-shadow:0 3px 0 #000}
.mode{margin-left:12px;padding:7px 18px;border-radius:18px;font-weight:900;
  background:rgba(3,34,53,.82);border:1px solid rgba(99,220,255,.6)}
.headRight{display:flex;gap:10px;align-items:center}
.pill{padding:9px 18px;border-radius:22px;font-weight:900;white-space:nowrap;
  background:rgba(3,34,53,.82);border:1px solid rgba(99,220,255,.6)}

/* --- opponents: compact identity, no big bordered panels ------------------ */
.players{position:absolute;inset:0;z-index:15;pointer-events:none}
.seat{position:absolute;display:flex;align-items:center;gap:12px;text-shadow:0 2px 6px #000}
.seat[data-where="left"]{left:36px;top:250px}
.seat[data-where="right"]{left:1300px;top:250px;flex-direction:row-reverse;text-align:right}
.seat[data-where="top"]{left:690px;top:88px}
/* Seated at the near-left edge of the table, clear of the drawing board. */
.seat[data-where="bottom"]{left:150px;top:572px;flex-direction:column;text-align:center;gap:8px}
.seat[data-where="bottom"] .meta{min-width:190px}
.avatar>img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.avatar{width:88px;height:88px;flex:0 0 88px;border-radius:50%;padding:4px;
  background:conic-gradient(#ffe44d,#25d9ff,#ffdc3d,#25d9ff,#ffe44d);
  box-shadow:0 0 0 4px rgba(3,31,47,.9),0 0 20px rgba(53,220,255,.5)}
.avatar>span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;
  background:#0b78ad;font-size:34px}
.seat.is-active .avatar{box-shadow:0 0 0 5px #ffe44d,0 0 26px 6px rgba(255,228,77,.75)}
.meta{min-width:150px;padding:7px 13px;border-radius:13px;
  background:rgba(3,39,60,.86);border:1px solid rgba(74,213,255,.7)}
.name{font-size:19px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{margin-top:3px;color:#ffd85b;font-size:15px;font-weight:900}
.thinking{color:#8be9ff;font-size:13px;font-weight:800;min-height:15px}

/* --- drawing board -------------------------------------------------------- */
/* The stage geometry is measured from classic-bg/classic-table-scene.webp:
   the drawing surface painted on the table is a trapezoid (perspective), whose
   corners land at stage (532.6,466.4) (1080.8,466.4) (1144.2,705.7)
   (454.8,705.7). The canvas is that trapezoid's bounding box, clipped to the
   trapezoid itself, so the drawing sits IN the table's board and the wooden
   border of the artwork stays visible around it. */
.boardWrap{position:absolute;z-index:20;left:455px;top:466px;width:689px;height:239px}
#board{width:689px;height:239px;display:block;background:rgba(247,250,252,.94);
  clip-path:polygon(11.3% 0%,90.8% 0%,100% 100%,0% 100%);touch-action:none}
.boardWrap.readonly #board{cursor:default}
.boardWrap:not(.readonly) #board{cursor:crosshair}
.boardHint{position:absolute;left:0;right:0;top:100%;margin-top:8px;text-align:center;
  font-size:14px;font-weight:800;color:#cdefff;text-shadow:0 2px 6px #000}
.boardTools{position:absolute;z-index:21;left:455px;top:424px;width:689px;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
.swatch,.clearBtn{pointer-events:auto;border-radius:10px;border:1px solid rgba(99,220,255,.6);
  background:rgba(3,34,53,.85);color:#fff;font-weight:900;font-size:13px;padding:6px 10px;cursor:pointer}
.swatch.on{outline:2px solid #ffe44d}
.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:16px;padding:5px 12px;
  border-radius:10px;background:rgba(3,34,53,.85);border:1px solid rgba(99,220,255,.6)}
.timer.urgent{background:rgba(120,20,20,.9);border-color:#ff6b6b;color:#ffd9d9}

/* --- reveal banner -------------------------------------------------------- */
.banner{position:absolute;z-index:21;left:455px;top:414px;width:689px;height:0}
.reveal{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);
  padding:9px 22px;border-radius:14px;font-weight:900;font-size:19px;white-space:nowrap;
  background:rgba(3,34,53,.92);border:2px solid #ffe44d;box-shadow:0 8px 22px rgba(0,0,0,.45)}
.reveal .blanks{letter-spacing:7px;color:#8be9ff}

/* --- local 14-card hand --------------------------------------------------- */
.bottom{position:absolute;z-index:25;left:0;right:0;bottom:0;height:180px}
.hand{position:absolute;left:313px;bottom:70px;display:flex;gap:6px}
.letter{width:64px;height:88px;border-radius:10px;cursor:pointer;user-select:none;
  font-family:inherit;font-size:38px;font-weight:900;color:#12303f;
  background:linear-gradient(180deg,#ffffff,#e6eef4);
  border:2px solid rgba(3,31,47,.75);box-shadow:0 5px 0 rgba(0,0,0,.35);
  display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
.letter:hover{transform:translateY(-4px)}
.letter.selected{transform:translateY(-14px);color:#1b1000;
  background:linear-gradient(180deg,#fff3b0,#ffd54a);border-color:#fff;}
.handEmpty{position:absolute;left:313px;bottom:96px;width:974px;text-align:center;
  font-size:15px;font-weight:800;color:#cdefff}
.wordPreview{position:absolute;left:0;right:0;bottom:26px;text-align:center;
  font-size:24px;font-weight:900;letter-spacing:5px;min-height:30px;color:#ffe44d;
  text-shadow:0 3px 8px #000}
.actions{position:absolute;right:32px;bottom:70px;width:246px;display:flex;flex-direction:column;gap:12px}
.action{font-family:inherit;font-size:17px;font-weight:900;padding:14px 0;border-radius:14px;
  cursor:pointer;color:#fff;background:rgba(3,34,53,.9);border:2px solid rgba(99,220,255,.65);
  box-shadow:0 5px 0 rgba(0,0,0,.35)}
.action:disabled{opacity:.45;cursor:not-allowed}
.action.submit{background:linear-gradient(180deg,#39c26a,#1f8c48);border-color:#8bf0b0}

/* --- chat (right) and reactions (left): small, out of the way ------------- */
.chat{position:absolute;z-index:26;left:1292px;top:396px;width:276px;height:304px;
  display:flex;flex-direction:column;border-radius:14px;
  background:rgba(3,31,47,.86);border:1px solid rgba(74,213,255,.55);overflow:hidden}
.chat h3{margin:0;padding:9px 13px;font-size:13px;letter-spacing:1px;
  background:rgba(0,0,0,.28);display:flex;justify-content:space-between}
.msgs{flex:1;overflow:hidden;padding:8px 12px;font-size:13px;line-height:1.5}
.msg{word-break:break-word}
.msg b{color:#8be9ff}
.chatInput{display:flex;border-top:1px solid rgba(74,213,255,.35)}
.chatInput input{flex:1;min-width:0;border:0;background:transparent;color:#fff;
  padding:10px 12px;font-family:inherit;font-size:13px;outline:none}
.chatInput button{border:0;background:#0b78ad;color:#fff;font-weight:900;
  padding:0 15px;cursor:pointer}

.reactions{position:absolute;z-index:26;left:30px;top:400px;width:70px;
  display:flex;flex-direction:column;gap:10px}
.react{width:66px;height:52px;font-size:24px;border-radius:12px;cursor:pointer;
  background:rgba(3,31,47,.86);border:1px solid rgba(74,213,255,.55)}
.react:hover{background:rgba(11,120,173,.9)}
/* floating reaction bubbles */
.bubbleLayer{position:absolute;inset:0;z-index:27;pointer-events:none;overflow:hidden}
.bubble{position:absolute;font-size:40px;animation:float 2.4s ease-out forwards}
@keyframes float{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-90px)}}

/* --- status line ---------------------------------------------------------- */
.status{position:absolute;z-index:30;left:0;right:0;top:82px;text-align:center;
  font-size:15px;font-weight:800;color:#cdefff;text-shadow:0 2px 6px #000}
.status.bad{color:#ff9c9c}

/* --- portrait / too-narrow guard ----------------------------------------- */
#rotate{position:fixed;inset:0;z-index:200;display:none;place-items:center;
  background:#061827;text-align:center;padding:28px}
#rotate.on{display:grid}
#rotate .box{max-width:420px}
#rotate .ico{font-size:64px;margin-bottom:14px}
#rotate h2{margin:0 0 8px;font-size:22px}
#rotate p{margin:0;color:#9fc4d8;font-size:15px;line-height:1.5}
</style>
</head>
<body>
<div id="bleed"></div>
<div id="stage">
  <img id="sceneBg" src="classic-bg/classic-scene-hd.webp" alt="">
  <img id="tableScene" src="classic-bg/classic-table-scene.webp" alt="">

  <header class="header">
    <div><span class="brand">CHAMP WORD</span><span class="mode">CLASSIC</span></div>
    <div class="headRight">
      <span class="pill" id="turnPill">WAITING</span>
      <span class="pill" id="seatPill">SEAT —</span>
      <span class="pill">🪙 <b id="myScore">0</b></span>
    </div>
  </header>

  <div class="status" id="status">Connecting…</div>

  <div class="players">
    <div class="seat" data-where="left"  id="seat-left">  <div class="avatar"><span>🙂</span></div><div class="meta"><div class="name">Waiting…</div><div class="score">🪙 0</div><div class="thinking"></div></div></div>
    <div class="seat" data-where="right" id="seat-right"> <div class="avatar"><span>😎</span></div><div class="meta"><div class="name">Waiting…</div><div class="score">🪙 0</div><div class="thinking"></div></div></div>
    <div class="seat" data-where="top"   id="seat-top">   <div class="avatar"><span>🧐</span></div><div class="meta"><div class="name">Waiting…</div><div class="score">🪙 0</div><div class="thinking"></div></div></div>
    <div class="seat" data-where="bottom" id="seat-me"><div class="avatar"><img id="meAvatar" alt="" hidden><span id="meAvatarFallback">🧑</span></div><div class="meta"><div class="name">You</div><div class="score">🪙 0</div><div class="thinking"></div></div></div>
  </div>

  <div class="banner"><div class="reveal" id="reveal">Waiting for the first turn…</div></div>

  <div class="boardTools">
    <div style="display:flex;gap:6px;align-items:center">
      <button class="swatch on" data-color="#12303f" style="background:#12303f">&#9679;</button>
      <button class="swatch" data-color="#c0392b" style="background:#c0392b">&#9679;</button>
      <button class="swatch" data-color="#1f6feb" style="background:#1f6feb">&#9679;</button>
      <button class="clearBtn" id="clearBoard">CLEAR</button>
    </div>
    <div class="timer" id="timer">--</div>
  </div>

  <div class="boardWrap readonly" id="boardWrap">
    <canvas id="board" width="1378" height="478"></canvas>
    <div class="boardHint" id="boardHint">Waiting for a turn…</div>
  </div>

  <div class="reactions">
    <button class="react" data-emoji="😀">😀</button>
    <button class="react" data-emoji="😂">😂</button>
    <button class="react" data-emoji="😮">😮</button>
    <button class="react" data-emoji="❤️">❤️</button>
  </div>

  <aside class="chat">
    <h3><span>LIVE CHAT</span><span id="chatCount">· 0</span></h3>
    <div class="msgs" id="msgs"></div>
    <div class="chatInput"><input id="chatInput" placeholder="Type a message…" maxlength="200"><button id="send">➤</button></div>
  </aside>

  <div class="bottom">
    <div class="hand" id="hand"></div>
    <div class="handEmpty" id="handEmpty" style="display:none">Waiting for your cards…</div>
    <div class="wordPreview" id="wordPreview"></div>
    <div class="actions">
      <button class="action" id="shuffle">↝ SHUFFLE</button>
      <button class="action submit" id="submit" disabled>✓ SUBMIT</button>
    </div>
  </div>

  <div class="bubbleLayer" id="bubbles"></div>
</div>

<div id="rotate"><div class="box">
  <div class="ico">📱↻</div>
  <h2>Rotate your device</h2>
  <p>CHAMP WORD Classic is played in landscape. Turn your device sideways to continue.</p>
</div></div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const PLACEHOLDER = "-";

  /* --- uniform stage scaling: the only place viewport size is ever read ---- */
  function fit() {
    const w = window.innerWidth, h = window.innerHeight;
    document.documentElement.style.setProperty("--s", Math.min(w / 1600, h / 900));
    // Landscape-first: below ~1.15 aspect the 16:9 stage would shrink to the
    // point of being unplayable, so ask for landscape instead of squashing it.
    $("rotate").classList.toggle("on", w / h < 1.15);
  }
  window.addEventListener("resize", fit, { passive: true });
  window.addEventListener("orientationchange", fit, { passive: true });
  fit();

  const DEMO = new URLSearchParams(location.search).get("demo") === "1";

  const state = {
    sessionToken: localStorage.getItem("champword.session") || null,
    playerId: null,
    roomId: null,
    snapshot: null,
    hand: [],
    selected: [],          // ordered: click order is the answer order
    targetWord: null,      // only ever set for the artist
    turnNumber: 0,
    deadline: null,
    clockOffset: 0,        // serverNow - clientNow, so countdowns ignore skew
    strokes: [],
    color: "#12303f",
    seq: 0,
    // Handed to us by the parent game frame (index.html) when embedded.
    profile: { name: null, avatar: null, coins: null }
  };

  let ws = null;

  /* --- small helpers ------------------------------------------------------ */
  const rid = () => "r" + Date.now() + "-" + (++state.seq);
  function setStatus(text, bad) {
    const el = $("status");
    el.textContent = text;
    el.classList.toggle("bad", !!bad);
  }
  const serverNow = () => Date.now() + state.clockOffset;
  const isArtist = () => !!state.snapshot && state.snapshot.activePlayerId === state.playerId;
  const nameOf = (p) => (p.playerId === state.playerId ? "You" : (p.displayName || p.playerId.slice(0, 8)));
  const send = (msg) => {
    if (ws && ws.readyState === 1) { ws.send(JSON.stringify(msg)); return true; }
    return false;
  };
  const withToken = (msg) => (state.sessionToken ? Object.assign({ sessionToken: state.sessionToken }, msg) : msg);

  /* ======================================================================
     Rendering
     ====================================================================== */

  function renderPlayers() {
    const snap = state.snapshot;
    if (!snap) return;
    const me = snap.players.find((p) => p.playerId === state.playerId);
    const others = snap.players.filter((p) => p.playerId !== state.playerId);
    const where = ["left", "right", "top"];
    where.forEach((spot, i) => {
      const p = others[i];
      const el = $("seat-" + spot);
      if (!p) {
        el.style.visibility = "hidden";
        return;
      }
      el.style.visibility = "visible";
      el.querySelector(".name").textContent = nameOf(p);
      el.querySelector(".score").textContent = "🪙 " + p.score + (p.isBot ? "  ·BOT" : "");
      el.querySelector(".avatar > span").textContent = p.isBot ? (i === 0 ? "🙂" : i === 1 ? "😎" : "🧐") : "🧑";
      el.classList.toggle("is-active", p.playerId === snap.activePlayerId);
    });
    // The local player is seated at the table too — a pill in the header is not
    // an avatar sitting at the table.
    const meSeat = $("seat-me");
    meSeat.style.visibility = "visible";
    meSeat.querySelector(".name").textContent = state.profile.name || "You";
    meSeat.querySelector(".score").textContent = "🪙 " + (me ? me.score : state.profile.coins ?? 0);
    meSeat.classList.toggle("is-active", !!me && me.playerId === snap.activePlayerId);
    if (state.profile.avatar) {
      const avatar = $("meAvatar");
      if (avatar.getAttribute("src") !== state.profile.avatar) avatar.src = state.profile.avatar;
      avatar.hidden = false;
      $("meAvatarFallback").hidden = true;
    }
    $("myScore").textContent = me ? me.score : 0;
    $("seatPill").textContent = "SEAT " + (me ? me.seatNumber + 1 : PLACEHOLDER);
    $("turnPill").textContent = "TURN " + snap.turnNumber + " · " + String(snap.phase).toUpperCase();
  }

  function renderHand() {
    const root = $("hand");
    root.textContent = "";
    if (state.hand.length === 0) {
      $("handEmpty").style.display = "block";
      $("handEmpty").textContent = "Waiting for your cards…";
      return;
    }
    $("handEmpty").style.display = "none";
    for (const card of state.hand) {
      const btn = document.createElement("button");
      const picked = state.selected.includes(card.cardId);
      btn.className = "letter" + (picked ? " selected" : "");
      btn.type = "button";
      btn.textContent = card.value.toUpperCase();
      btn.setAttribute("aria-label", "letter " + card.value);
      btn.setAttribute("aria-pressed", String(picked));
      btn.addEventListener("click", () => toggleCard(card.cardId));
      root.appendChild(btn);
    }
    renderWordPreview();
  }

  function renderWordPreview() {
    const word = state.selected
      .map((id) => state.hand.find((c) => c.cardId === id))
      .filter(Boolean)
      .map((c) => c.value.toUpperCase())
      .join("");
    $("wordPreview").textContent = word;
    // §13: the artist draws and does not solve. The server refuses it anyway;
    // disabling the button just avoids offering an action that cannot work.
    $("submit").disabled = word.length === 0 || state.hand.length === 0 || isArtist();
  }

  function toggleCard(cardId) {
    const at = state.selected.indexOf(cardId);
    if (at >= 0) state.selected.splice(at, 1);
    else state.selected.push(cardId);
    renderHand();
  }

  function renderTurn() {
    const snap = state.snapshot;
    const artist = isArtist();
    const wrap = $("boardWrap");

    wrap.classList.toggle("readonly", !artist);
    $("clearBoard").style.display = artist ? "" : "none";
    document.querySelectorAll(".swatch").forEach((s) => (s.style.display = artist ? "" : "none"));

    if (artist && state.targetWord) {
      $("reveal").innerHTML = 'DRAW THIS: <span style="color:#ffe44d">' + state.targetWord.toUpperCase() + "</span>";
      $("boardHint").textContent = "You are the artist — draw it. You cannot solve your own drawing.";
    } else if (snap && snap.targetWordLength) {
      const blanks = Array.from({ length: snap.targetWordLength }, () => "_").join(" ");
      $("reveal").innerHTML = 'GUESS THE DRAWING: <span class="blanks">' + blanks + "</span>";
      $("boardHint").textContent = "Pick letters from your hand to spell the answer.";
    } else {
      $("reveal").textContent = "Waiting for the first turn…";
      $("boardHint").textContent = "Waiting for a turn…";
    }
  }

  function tickTimer() {
    const el = $("timer");
    const deadline = state.deadline;
    if (!deadline) { el.textContent = "--"; el.classList.remove("urgent"); return; }
    const left = Math.max(0, deadline - serverNow());
    el.textContent = (left / 1000).toFixed(1) + "s";
    el.classList.toggle("urgent", left <= 1000);
  }
  setInterval(tickTimer, 100);

  function renderChat() {
    const root = $("msgs");
    $("chatCount").textContent = "· " + root.childElementCount;
    while (root.childElementCount > 60) root.removeChild(root.firstChild);
    root.scrollTop = root.scrollHeight;
  }
  function addChat(who, text) {
    const d = document.createElement("div");
    d.className = "msg";
    const b = document.createElement("b");
    b.textContent = who + ": ";
    d.appendChild(b);
    d.appendChild(document.createTextNode(text));
    $("msgs").appendChild(d);
    renderChat();
  }
  function addBubble(emoji) {
    const spots = [18, 36, 54, 72, 88];
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = emoji;
    b.style.left = spots[Math.floor(Math.random() * spots.length)] + "%";
    b.style.top = (30 + Math.random() * 40) + "%";
    $("bubbles").appendChild(b);
    setTimeout(() => b.remove(), 2500);
  }

  /* --- drawing board ------------------------------------------------------ */
  const board = $("board");
  const ctx = board.getContext("2d");
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  function drawStroke(stroke) {
    if (!stroke || !Array.isArray(stroke.points) || stroke.points.length === 0) return;
    ctx.strokeStyle = stroke.color || "#12303f";
    // board.width is the 2x backing store of the 689px-wide CSS board.
    ctx.lineWidth = (stroke.width || 4) * (board.width / 689);
    ctx.beginPath();
    stroke.points.forEach(([nx, ny], i) => {
      const x = nx * board.width, y = ny * board.height;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    if (stroke.points.length === 1) {
      const [nx, ny] = stroke.points[0];
      ctx.lineTo(nx * board.width + 0.6, ny * board.height + 0.6);
    }
    ctx.stroke();
  }
  function clearBoard() {
    ctx.clearRect(0, 0, board.width, board.height);
    state.strokes = [];
  }
  function applyLocalStroke(stroke) {
    state.strokes.push(stroke);
    drawStroke(stroke);
  }

  let drawing = null;
  function normalise(ev) {
    const r = board.getBoundingClientRect();
    return [
      Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width)),
      Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height))
    ];
  }
  board.addEventListener("pointerdown", (ev) => {
    if (!isArtist()) return;
    board.setPointerCapture(ev.pointerId);
    drawing = { points: [normalise(ev)], color: state.color, width: 4 };
    drawStroke(drawing);
  });
  board.addEventListener("pointermove", (ev) => {
    if (!drawing) return;
    drawing.points.push(normalise(ev));
    drawStroke({ points: drawing.points.slice(-2), color: drawing.color, width: drawing.width });
  });
  const endStroke = () => {
    if (!drawing) return;
    const stroke = drawing;
    drawing = null;
    applyLocalStroke(stroke);
    send(withToken({
      type: "draw_op",
      requestId: rid(),
      roomId: state.roomId,
      turnNumber: state.turnNumber,
      strokes: [stroke]
    }));
  };
  board.addEventListener("pointerup", endStroke);
  board.addEventListener("pointercancel", endStroke);
  board.addEventListener("pointerleave", endStroke);

  document.querySelectorAll(".swatch").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.color = btn.dataset.color;
      document.querySelectorAll(".swatch").forEach((s) => s.classList.toggle("on", s === btn));
    });
  });
  $("clearBoard").addEventListener("click", clearBoard);

  /* ======================================================================
     Server messages — the client renders what it is told and decides nothing
     ====================================================================== */

  function onMessage(msg) {
    switch (msg.type) {
      case "server_ready":
        send({ type: "hello", requestId: rid(), clientVersion: "2.0" });
        break;

      case "welcome":
        state.playerId = msg.playerId;
        state.sessionToken = msg.sessionToken;
        localStorage.setItem("champword.session", msg.sessionToken);
        if (msg.serverTime) state.clockOffset = new Date(msg.serverTime).getTime() - Date.now();
        setStatus("Finding players…");
        send(withToken({
          type: "find_match",
          requestId: rid(),
          displayName: localStorage.getItem("champword.name") || "You"
        }));
        break;

      case "match_queued":
        setStatus("Waiting for players…");
        break;

      case "match_found":
        state.roomId = msg.roomId;
        $("seatPill").textContent = "SEAT " + (msg.seatNumber + 1);
        setStatus("Match found — starting…");
        break;

      case "room_snapshot":
        state.snapshot = msg;
        state.roomId = msg.roomId;
        if (msg.serverTime) state.clockOffset = new Date(msg.serverTime).getTime() - Date.now();
        if (msg.turnDeadlineAt) state.deadline = new Date(msg.turnDeadlineAt).getTime();
        if (typeof msg.turnNumber === "number" && msg.turnNumber !== state.turnNumber) {
          state.turnNumber = msg.turnNumber;
          clearBoard();
        }
        renderPlayers();
        renderTurn();
        break;

      case "hand_sync": {
        state.hand = Array.isArray(msg.hand) ? msg.hand : [];
        const keep = state.selected.filter((id) => state.hand.some((c) => c.cardId === id));
        state.selected = keep;
        renderHand();
        setStatus("Your private hand: " + state.hand.length + " cards");
        break;
      }

      case "turn_started":
        state.turnNumber = msg.turnNumber;
        state.deadline = msg.turnDeadlineAt ? new Date(msg.turnDeadlineAt).getTime() : null;
        state.targetWord = null;          // revealed only to the artist
        clearBoard();
        state.selected = [];
        renderHand();
        if (state.snapshot) {
          state.snapshot.activePlayerId = msg.activePlayerId;
          state.snapshot.turnNumber = msg.turnNumber;
          state.snapshot.roundNumber = msg.roundNumber;
          state.snapshot.phase = "playing";
          state.snapshot.targetWordLength = msg.targetWordLength;
          state.snapshot.turnDeadlineAt = msg.turnDeadlineAt;
        }
        renderPlayers();
        renderTurn();
        setStatus(msg.activePlayerId === state.playerId ? "Your turn to draw!" : "Someone is drawing…");
        break;

      case "word_reveal":
        state.targetWord = msg.targetWord;
        renderTurn();
        break;

      case "bot_action": {
        // Bot status is decoration only — the server still owns the outcome.
        if (!state.snapshot) break;
        const others = state.snapshot.players.filter((p) => p.playerId !== state.playerId);
        const idx = others.findIndex((p) => p.playerId === msg.playerId);
        const where = ["left", "right", "top"][idx];
        if (where) {
          const slot = $("seat-" + where).querySelector(".thinking");
          if (slot) slot.textContent = msg.kind === "submit" ? "solving…" : "no move";
        }
        break;
      }

      case "word_submission_result":
        if (msg.hand && Array.isArray(msg.hand)) {
          state.hand = msg.hand;
          state.selected = [];
          renderHand();
        }
        if (msg.status === "accepted") { setStatus("Accepted ✓  +" + (msg.scoreDelta || 0)); state.selected = []; renderWordPreview(); }
        else if (msg.status === "duplicate") setStatus("Already submitted");
        else setStatus(msg.reason, true);
        break;

      case "turn_ended": {
        const label = msg.terminalState === "solved" ? "SOLVED"
                    : msg.terminalState === "timed_out" ? "TIME UP"
                    : "NO MOVE";
        addChat("Turn " + msg.turnNumber, label + (msg.word ? " — the word was " + msg.word.toUpperCase() : ""));
        setStatus("Turn " + msg.turnNumber + " ended: " + label);
        state.selected = [];
        state.targetWord = null;
        document.querySelectorAll(".thinking").forEach((t) => (t.textContent = ""));
        clearBoard();
        renderHand();
        break;
      }

      case "chat_message":
        addChat(nameOf({ playerId: msg.playerId, displayName: localStorage.getItem("champword.name") }), msg.text);
        break;

      case "reaction":
        addBubble(msg.emoji);
        break;

      case "draw_op":
        if (!isArtist()) (msg.strokes || []).forEach(drawStroke);
        break;

      case "draw_sync":
        clearBoard();
        (msg.strokes || []).forEach(drawStroke);
        break;

      case "error":
        // A refused late submission is normal; do not shout about it.
        if (msg.code === "solve_window_expired" || msg.code === "stale_turn") setStatus("Too late — the turn moved on", true);
        else setStatus(msg.code, true);
        break;

      default:
        break;
    }
  }

  /* --- connection --------------------------------------------------------- */
  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(proto + "://" + location.host);
    ws.addEventListener("open", () => setStatus("Connected — finding players…"));
    ws.addEventListener("close", () => setStatus("Disconnected — reload to reconnect", true));
    ws.addEventListener("error", () => setStatus("Connection error", true));
    ws.addEventListener("message", (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg && typeof msg === "object") onMessage(msg);
    });
  }

  /* --- controls ----------------------------------------------------------- */
  $("shuffle").addEventListener("click", () => {
    // Presentation only: shuffling reorders the view, never the authoritative hand.
    state.hand = state.hand.slice().sort(() => Math.random() - 0.5);
    renderHand();
  });

  $("submit").addEventListener("click", () => {
    if (state.selected.length === 0) return;
    const cards = state.selected
      .map((id) => state.hand.find((c) => c.cardId === id))
      .filter(Boolean);
    if (cards.length !== state.selected.length) return;
    const word = cards.map((c) => c.value).join("");
    const ok = send(withToken({
      type: "submit_word",
      requestId: rid(),
      roomId: state.roomId,
      roundNumber: state.snapshot ? state.snapshot.roundNumber : 0,
      turnNumber: state.turnNumber,
      cards: cards.map((c) => c.cardId),
      word
    }));
    setStatus(ok ? "Submitting " + word.toUpperCase() + "…" : "Not connected");
  });

  $("send").addEventListener("click", sendChat);
  $("chatInput").addEventListener("keydown", (ev) => { if (ev.key === "Enter") sendChat(); });
  function sendChat() {
    const input = $("chatInput");
    const text = input.value.trim();
    if (!text) return;
    const name = localStorage.getItem("champword.name") || "You";
    localStorage.setItem("champword.name", name);
    send(withToken({ type: "chat_send", requestId: rid(), text }));
    input.value = "";
  }

  document.querySelectorAll(".react").forEach((btn) => {
    btn.addEventListener("click", () => {
      addBubble(btn.dataset.emoji);
      send(withToken({ type: "reaction_send", requestId: rid(), emoji: btn.dataset.emoji }));
    });
  });

  /* ======================================================================
     Offline demo fixture — VISUAL QA ONLY (?demo=1). Never runs otherwise.
     ====================================================================== */
  function runDemo() {
    const mk = (id, name, score, isBot) => ({ playerId: id, seatNumber: 0, connected: true, score, isBot, displayName: name });
    state.playerId = "me";
    state.roomId = "demo-room";
    state.snapshot = {
      type: "room_snapshot", roomId: "demo-room", eventSequence: 1,
      state: "active", phase: "playing", roundNumber: 1, turnNumber: 7,
      activePlayerId: "me", firstSolverId: null, solvedAt: null, solveWindowEndsAt: null,
      turnStartedAt: new Date(Date.now() - 800).toISOString(),
      turnDeadlineAt: new Date(Date.now() + 2200).toISOString(),
      targetWordLength: 7,
      players: [mk("me", "You", 1450, false), mk("b1", "Aiko", 1240, true), mk("b2", "Kai", 980, true), mk("b3", "Mina", 1320, true)],
      serverTime: new Date().toISOString()
    };
    state.deadline = new Date(state.snapshot.turnDeadlineAt).getTime();
    state.targetWord = "lantern";
    state.turnNumber = 7;
    // Exactly 14 cards: the 7 letters of "lantern" plus 7 filler letters.
    state.hand = "LANTERNXQZMKPY".split("").map((ch, i) => ({ cardId: "c" + i, value: ch.toLowerCase() }));
    state.selected = [state.hand[0].cardId, state.hand[1].cardId];
    renderPlayers(); renderHand(); renderTurn();
    setStatus("DEMO MODE — no server connection");
    addChat("Aiko", "that looks like a lamp?");
    addChat("Kai", "is it 7 letters?");
    addBubble("😂");
    applyLocalStroke({ points: [[0.15,0.55],[0.3,0.2],[0.45,0.55],[0.6,0.2],[0.75,0.55]], color: "#12303f", width: 4 });
    applyLocalStroke({ points: [[0.22,0.7],[0.8,0.72]], color: "#c0392b", width: 5 });
  }

  /* The parent game frame (index.html) posts the player's profile when this page
     is embedded: avatar image, display name and coin balance. */
  addEventListener("message", (event) => {
    const data = event && event.data ? event.data : {};
    if (typeof data.champEquippedAvatar === "string" && data.champEquippedAvatar) {
      state.profile.avatar = data.champEquippedAvatar;
    }
    if (typeof data.champName === "string" && data.champName) state.profile.name = data.champName;
    if (data.champCoins !== undefined && data.champCoins !== null && data.champCoins !== "") {
      state.profile.coins = data.champCoins;
    }
    if (state.snapshot) renderPlayers();
  });

  if (DEMO) runDemo();
  else connect();
})();
</script>
</body>
