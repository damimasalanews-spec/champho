name: Production WebSocket Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - protocol/authoritative-multiplayer-contract

jobs:
  websocket-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: protocol/authoritative-multiplayer-contract

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run production WebSocket smoke test
        env:
          WS_URL: wss://champword-backend.onrender.com
        run: |
          node --input-type=module <<'EOF'
          import WebSocket from "ws";

          const url = process.env.WS_URL;
          if (!url) throw new Error("WS_URL is required");

          const sockets = [];
          const queues = new WeakMap();
          const waiters = new WeakMap();

          function connect() {
            return new Promise((resolve, reject) => {
              const ws = new WebSocket(url);
              sockets.push(ws);
              queues.set(ws, []);
              waiters.set(ws, []);

              ws.on("message", data => {
                const message = JSON.parse(data.toString());
                const pending = waiters.get(ws);
                if (pending?.length) {
                  const waiter = pending.shift();
                  waiter(message);
                } else {
                  queues.get(ws).push(message);
                }
              });

              ws.once("open", () => resolve(ws));
              ws.once("error", reject);
            });
          }

          function waitFor(ws, predicate, label, timeoutMs = 5000) {
            const queue = queues.get(ws);
            const existing = queue.findIndex(predicate);
            if (existing >= 0) return Promise.resolve(queue.splice(existing, 1)[0]);

            return new Promise((resolve, reject) => {
              const timeout = setTimeout(() => {
                const pending = waiters.get(ws);
                const index = pending.indexOf(onMessage);
                if (index >= 0) pending.splice(index, 1);
                reject(new Error(`Timed out waiting for ${label}`));
              }, timeoutMs);

              function onMessage(message) {
                clearTimeout(timeout);
                resolve(message);
              }

              waiters.get(ws).push(message => {
                if (predicate(message)) onMessage(message);
                else queue.push(message);
              });
            });
          }

          function send(ws, message) {
            ws.send(JSON.stringify(message));
          }

          function closeAll() {
            for (const ws of sockets) {
              try { ws.close(); } catch {}
            }
          }

          const ws1 = await connect();
          const ready1 = await waitFor(ws1, m => m.type === "server_ready", "server_ready");
          if (ready1.type !== "server_ready") throw new Error("server_ready missing");

          const requestId = `smoke-${Date.now()}`;
          send(ws1, {
            type: "create_room",
            requestId,
          });

          const created = await waitFor(ws1, m => m.type === "room_created", "room_created");
          const roomId = created.roomId;

          const ws2 = await connect();
          await waitFor(ws2, m => m.type === "server_ready", "server_ready ws2");

          send(ws2, {
            type: "join_room",
            requestId: `${requestId}-join`,
            roomId,
            playerId: "smoke-player-2",
          });

          await waitFor(ws1, m => m.type === "room_snapshot" && m.roomId === roomId, "room_snapshot");
          await waitFor(ws2, m => m.type === "room_snapshot" && m.roomId === roomId, "room_snapshot ws2");

          send(ws1, {
            type: "start_round",
            requestId: `${requestId}-start`,
            roomId,
          });

          const startSnapshot = await waitFor(
            ws1,
            m => m.type === "room_snapshot" && m.roomId === roomId && m.phase === "playing",
            "start round snapshot",
          );

          const starterId = startSnapshot.activePlayerId;
          const submitRequest = `${requestId}-submit`;
          send(ws1, {
            type: "submit_word",
            requestId: submitRequest,
            roomId,
            playerId: created.playerId,
            roundNumber: startSnapshot.roundNumber,
            turnNumber: startSnapshot.turnNumber,
            cards: ["smoke-card-a", "smoke-card-b"],
            word: "ab",
          });

          const result1 = await waitFor(
            ws1,
            m => m.type === "word_submission_result" && m.requestId === submitRequest,
            "first word submission result",
          );
          if (result1.result !== "accepted" || result1.isFirstSolver !== true) {
            throw new Error("first solver assertion failed");
          }

          const result2 = await waitFor(
            ws2,
            m => m.type === "word_submitted" && m.roomId === roomId,
            "word_submitted broadcast",
          );
          if (result2.playerId !== created.playerId) throw new Error("word broadcast player mismatch");

          send(ws2, {
            type: "submit_word",
            requestId: `${requestId}-second`,
            roomId,
            playerId: "smoke-player-2",
            roundNumber: startSnapshot.roundNumber,
            turnNumber: startSnapshot.turnNumber,
            cards: ["smoke-card-a", "smoke-card-b"],
            word: "ab",
          });

          const result3 = await waitFor(
            ws2,
            m => m.type === "word_submission_result" && m.requestId === `${requestId}-second`,
            "second word submission result",
          );
          if (result3.result !== "accepted" || result3.isFirstSolver !== false) {
            throw new Error("second solver assertion failed");
          }

          await waitFor(
            ws1,
            m => m.type === "room_snapshot" && m.roomId === roomId && m.solveWindowEndsAt == null,
            "solve-window expiration",
          );

          const roundCompleted = await waitFor(
            ws1,
            m => m.type === "round_completed" && m.roomId === roomId,
            "round_completed",
          );
          if (roundCompleted.roundNumber !== startSnapshot.roundNumber) {
            throw new Error("round_completed round mismatch");
          }

          const nextRound = await waitFor(
            ws1,
            m => m.type === "room_snapshot" && m.roomId === roomId && m.roundNumber > startSnapshot.roundNumber,
            "next round snapshot",
          );
          if (nextRound.phase !== "playing") throw new Error("next round not active");

          ws1.close();
          await new Promise(resolve => setTimeout(resolve, 100));

          const ws3 = await connect();
          await waitFor(ws3, m => m.type === "server_ready", "server_ready reconnect");

          send(ws3, {
            type: "resume_room",
            requestId: `${requestId}-resume`,
            roomId,
            playerId: created.playerId,
            roundNumber: nextRound.roundNumber,
            lastEventSequence: nextRound.eventSequence,
            handVersion: 1,
          });

          const resumeStarted = await waitFor(
            ws3,
            m => m.type === "resume_started" && m.requestId === `${requestId}-resume`,
            "resume_started",
          );
          if (resumeStarted.roomId !== roomId) throw new Error("resume room mismatch");

          const resumedSnapshot = await waitFor(
            ws3,
            m => m.type === "room_snapshot" && m.roomId === roomId && m.roundNumber === nextRound.roundNumber,
            "resumed room snapshot",
          );
          if (resumedSnapshot.activePlayerId !== nextRound.activePlayerId) {
            throw new Error("resumed active player mismatch");
          }

          const resumeComplete = await waitFor(
            ws3,
            m => m.type === "resume_complete" && m.requestId === `${requestId}-resume`,
            "resume_complete",
          );
          if (resumeComplete.roomId !== roomId) throw new Error("resume complete room mismatch");

          const staleSocket = await connect();
          await waitFor(staleSocket, m => m.type === "server_ready", "server_ready stale");
          send(staleSocket, {
            type: "resume_room",
            requestId: `${requestId}-stale`,
            roomId,
            playerId: created.playerId,
            roundNumber: nextRound.roundNumber,
            lastEventSequence: nextRound.eventSequence,
            handVersion: 1,
          });
          await waitFor(
            staleSocket,
            m => m.type === "resume_complete" && m.requestId === `${requestId}-stale`,
            "stale resume complete",
          );
          staleSocket.close();

          console.log("PRODUCTION MULTIPLAYER SMOKE VERIFIED");
          closeAll();
          EOF