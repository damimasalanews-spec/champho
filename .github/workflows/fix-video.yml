name: Fix video playback error
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-video.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch video error guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='CHAMP_VIDEO_ERROR_GUARD_V1'
          if marker not in s:
              patch='''\n<script id="CHAMP_VIDEO_ERROR_GUARD_V1">\n(()=>{\n  const clean=()=>document.querySelectorAll('video').forEach(v=>{v.removeAttribute('src');try{v.pause()}catch(e){};v.style.display='none'});\n  window.addEventListener('error',e=>{if(e.target instanceof HTMLMediaElement){e.preventDefault();clean()}},true);\n  window.addEventListener('unhandledrejection',e=>{const m=String(e.reason||'');if(/media|video|playback|source|codec|mov|mp4|webm/i.test(m)){e.preventDefault();clean()}},true);\n  clean();\n})();\n</script>\n'''
              s=s.replace('</body>',patch+'</body>') if '</body>' in s else s+patch
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix video playback error guard [skip ci]'
          git push