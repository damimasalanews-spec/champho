name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps
        
      - name: Clean Cordova Configurations
        run: |
          sed -i '/capacitor-cordova-android-plugins/d' android/settings.gradle || true
          sed -i '/cordova.variables.gradle/d' android/app/capacitor.build.gradle || true
        
      - name: Compile App Without Tests
        run: |
          cd android && ./gradlew assembleDebug -x test -x lint
          
      - name: Generate Download Link
        uses: actions/upload-artifact@v4
        with:
          name: game-app-installer
          path: android/app/build/outputs/apk/debug/app-debug.apk
