name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Install System Dependencies
        run: |
          npm install --legacy-peer-deps
          npx cap sync android || true
        
      - name: Clear Legacy Plugins
        run: |
          sed -i '/capacitor-cordova-android-plugins/d' android/settings.gradle || true
          if [ -f android/app/capacitor.build.gradle ]; then
            sed -i '/cordova.variables.gradle/d' android/app/capacitor.build.gradle || true
          fi
        
      - name: Compile Application Package
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x test -x lint
          
      - name: Export Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: game-app-installer
          path: android/app/build/outputs/apk/debug/app-debug.apk
