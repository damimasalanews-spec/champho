name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize Web Project Metadata
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "champho-game", "version": "1.0.0", "dependencies": {"@capacitor/core": "latest", "@capacitor/cli": "latest"}}' > package.json
          fi

      - name: Install Framework Packages
        run: npm install

      - name: Generate Fresh Mobile Wrapper
        run: |
          # Safely move aside the broken directory to prevent compilation interference
          mv android android-legacy-backup || true
          npx cap init champho-game com.tanis.champho --web-dir=.
          npm install @capacitor/android
          npx cap add android

      - name: Compile Application Direct Package
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x test -x lint --no-daemon
          
      - name: Export Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: game-app-installer
          path: android/app/build/outputs/apk/debug/app-debug.apk
