name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize Web Project Metadata
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "champho-game", "version": "1.0.0", "dependencies": {"@capacitor/core": "latest", "@capacitor/cli": "latest"}}' > package.json
          fi

      - name: Install Framework Packages
        run: npm install

      - name: Generate Fresh Mobile Wrapper
        run: |
          # Safely move aside the broken directory to prevent compilation interference
          mv android android-legacy-backup || true
          # Do NOT run `cap init` here. It overwrote the checked-in
          # capacitor.config.json and set webDir to the repository root, so
          # Capacitor tried to copy the whole repo into its own subdirectory:
          #   Cannot copy '/home/runner/work/champho/champho' to a subdirectory
          #   of itself, '.../android/app/src/main/assets/public'
          # The checked-in config is the real one: webDir is mobile/www, a thin
          # shell whose server.url points at the deployed site, with offline.html
          # as the error page.
          npm install @capacitor/android
          # `cap add` writes the plugin manifest into app/src/main/assets, and that
          # directory does not exist in this project, so the step died with
          #   ENOENT: no such file or directory, open '.../assets/capacitor.plugins.json'
          # after it had already created the platform. Create the directory, tolerate
          # the half-finished add, then let sync complete it.
          npx cap add android || true
          mkdir -p android/app/src/main/assets
          npx cap sync android

      # `npx cap add android` builds the platform from Capacitor's template, which
      # carries no screenOrientation attribute. The repo's own manifest says
      # sensorLandscape, but it is moved aside before the add, so every APK this
      # workflow produced rotated freely and the landscape game came up portrait.
      # Put the lock back on the regenerated manifest before it is compiled.
      - name: Lock the activity to landscape
        run: |
          python3 - <<'PY'
          import pathlib

          manifest = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          if "android:screenOrientation" not in source:
              source = source.replace(
                  "<activity",
                  '<activity android:screenOrientation="sensorLandscape"',
                  1,
              )
              manifest.write_text(source)
              print("screenOrientation applied")
          else:
              print("screenOrientation already present")
          PY
          grep -o 'screenOrientation="[^"]*"' android/app/src/main/AndroidManifest.xml

      # Capacitor 8 compiles against Java 21, and the runner's default JDK is
      # older, so javac failed with "error: invalid source release: 21".
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Application Direct Package
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -x test -x lint --no-daemon
          
      - name: Export Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: game-app-installer
          path: android/app/build/outputs/apk/debug/app-debug.apk
