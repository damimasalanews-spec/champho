name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Inject Standalone Project Framework
        run: |
          if [ ! -f package.json ]; then
            echo '{"name": "champho-game", "version": "1.0.0"}' > package.json
          fi
          cd android
          chmod +x gradlew
          ./gradlew clean || true

      - name: Compile Application Direct Package
        run: |
          cd android
          ./gradlew assembleDebug -x test -x lint --no-daemon
          
      - name: Export Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: game-app-installer
          path: android/app/build/outputs/apk/debug/app-debug.apk
