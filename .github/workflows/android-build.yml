name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Auto-Fix Config Files
        run: |
          # Strip out the broken legacy framework lines immediately
          sed -i '/capacitor-cordova-android-plugins/d' android/settings.gradle || true
          if [ -f android/app/capacitor.build.gradle ]; then
            sed -i '/cordova.variables.gradle/d' android/app/capacitor.build.gradle || true
          fi

      - name: Compile App Package Instantly
        uses: kevin-david/bndl@v1
        with:
          project-path: 'android'
          build-type: 'apk'
          output-path: 'game-app.apk'

      - name: Generate Download Link
        uses: actions/upload-artifact@v4
        with:
          name: game-app-installer
          path: game-app.apk
