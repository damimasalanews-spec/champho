<!doctype html>
<html lang="ne-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d17">
<title>Champ Word — Letter Bumper 2v2</title>
<link rel="stylesheet" href="game/go-wild-2v2-finished.css?v=bumper1">
</head>
<body>
<div class="bumper-app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">CW</span><div><strong>CHAMP WORD</strong><small>LETTER BUMPER · 2v2</small></div></div>
    <div class="match-title"><span class="team-a">TEAM A</span><b>VS</b><span class="team-b">TEAM B</span></div>
    <button id="restartBtn" class="restart-btn" type="button" aria-label="Restart round">↻ <span>RESTART</span></button>
  </header>

  <main id="gameBoard" class="game-board">
    <canvas id="letterCanvas" aria-label="Bumper letter table. Drag and flick letters toward the player zones."></canvas>
    <div id="roundCallout" class="round-callout" aria-live="polite">Drag a letter, then flick it toward a player zone.</div>
  </main>

  <section class="score-dock" aria-label="Player letters and team scores">
    <article class="player-panel north" data-player="poker"><div class="player-heading"><i></i><b>Poker</b><span>⌃ NORTH</span><strong id="score-poker">0</strong></div><div id="rack-poker" class="letter-rack" aria-label="Poker's collected letters"></div></article>
    <article class="player-panel west" data-player="kalkal"><div class="player-heading"><i></i><b>Kalkal</b><span>◂ WEST</span><strong id="score-kalkal">0</strong></div><div id="rack-kalkal" class="letter-rack" aria-label="Kalkal's collected letters"></div></article>
    <article class="player-panel south human" data-player="champ"><div class="player-heading"><i></i><b>Champ · You</b><span>SOUTH ▾</span><strong id="score-champ">0</strong></div><div id="rack-champ" class="letter-rack" aria-label="Your collected letters"></div></article>
    <article class="player-panel east" data-player="jess"><div class="player-heading"><i></i><b>Jess</b><span>EAST ▸</span><strong id="score-jess">0</strong></div><div id="rack-jess" class="letter-rack" aria-label="Jess's collected letters"></div></article>
  </section>

  <div id="gameOver" class="game-over" aria-hidden="true">
    <div class="result-card"><small>ROUND COMPLETE</small><h1 id="resultTitle">TEAM A WINS</h1><p id="resultText"></p><button id="playAgainBtn" type="button">PLAY AGAIN</button></div>
  </div>
</div>
<script type="module" src="game/go-wild-2v2-finished.js?v=bumper1"></script>
</body>
</html>
