<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Offline — Champ Word</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1c4d06">
    <meta name="robots" content="noindex">
    <style>
        /* Self-contained on purpose. This page is the last resort of a service worker
           when the network AND the page cache have both failed, so it cannot depend on
           any other file in the repo being available. */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: radial-gradient(circle at 50% 35%, #356b12 0%, #17370a 60%, #0b1f04 100%);
            color: #fff;
            text-align: center;
        }

        .card {
            max-width: 520px;
            padding: 40px 36px 34px;
            border: 4px solid #fff;
            border-radius: 28px;
            background: rgba(0, 0, 0, .34);
            box-shadow: 0 20px 50px rgba(0, 0, 0, .45);
        }

        .pip {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .pip i {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: block;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 900;
            letter-spacing: .4px;
            margin-bottom: 12px;
        }

        p {
            font-size: 1.02rem;
            line-height: 1.55;
            color: rgba(255, 255, 255, .84);
            margin-bottom: 26px;
        }

        button {
            min-width: 200px;
            min-height: 56px;
            padding: 14px 28px;
            border: 0;
            border-radius: 18px;
            background: linear-gradient(180deg, #ffd83d 0%, #f0a800 55%, #c07f00 100%);
            color: #3a2400;
            font-family: inherit;
            font-size: 1.08rem;
            font-weight: 900;
            letter-spacing: .6px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 6px 0 #8a5c00, 0 12px 22px rgba(0, 0, 0, .4);
            transition: transform .12s ease, box-shadow .12s ease;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #8a5c00, 0 6px 12px rgba(0, 0, 0, .4);
        }

        .hint {
            margin-top: 20px;
            margin-bottom: 0;
            font-size: .9rem;
            color: rgba(255, 255, 255, .6);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="pip" aria-hidden="true">
            <i style="background:#e23b2e"></i>
            <i style="background:#f5c518"></i>
            <i style="background:#2f9e44"></i>
            <i style="background:#1c7ed6"></i>
        </div>
        <h1>You're offline</h1>
        <p>
            The table needs the network right now. Any page you have already opened
            still works — your installed app will keep playing from its cache.
        </p>
        <button type="button" onclick="location.reload()">Try again</button>
        <p class="hint">If you are installed as an app, relaunching it usually clears this.</p>
    </div>
</body>
</html>
