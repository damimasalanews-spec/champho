<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Champ Word — The Word Card Battle</title>
<meta name="description" content="Champ Word is a real-time word card battle. Match by colour or word, outplay three seats, climb the season ladder.">
<meta name="theme-color" content="#2a86e6">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="Champ Word — The Word Card Battle">
<meta property="og:description" content="Five ways to play. One felt table. Match by colour or word and take the pot.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css?v=5.1">
<link rel="stylesheet" href="assets/css/base.css?v=5.1">
<link rel="stylesheet" href="assets/css/components.css?v=5.1">
<link rel="stylesheet" href="assets/css/screens.css?v=5.1">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<!-- ------------------------------------------------------------------ sky -->
<div class="sky" aria-hidden="true">
  <span class="sky__rays"></span>
  <span class="sky__cloud sky__cloud--a"></span>
  <span class="sky__cloud sky__cloud--b"></span>
  <span class="sky__cloud sky__cloud--c"></span>
  <span class="sky__globe"></span>
  <span class="sky__vignette"></span>
</div>

<!-- ------------------------------------------------------------------ hud -->
<header class="hud">
  <div class="hud__player">
    <button class="hud__portrait" type="button" data-account aria-label="Your account and settings">
      <span class="avatar avatar--lg" data-avatar="lg"></span>
      <span class="hud__alert" aria-hidden="true">!</span>
    </button>

    <div class="hud__plate">
      <b class="hud__name" data-player-name>Champ</b>
      <div class="hud__row">
        <span class="hud__trophy" data-icon="trophy" aria-hidden="true"></span>
        <b class="hud__score" data-player-score>0</b>
      </div>
      <div class="hud__xp">
        <span class="hud__xpbar"><i data-xp-bar></i></span>
        <span class="hud__lv" data-level>Lv 1</span>
      </div>
    </div>
  </div>

  <div class="hud__wallet">
    <span class="wallet-pill">
      <span class="wallet-pill__ico wallet-pill__ico--coin" data-icon="coin" aria-hidden="true"></span>
      <b data-coins>0</b>
    </span>
    <button class="plus" type="button" data-buy="coins" aria-label="Get more coins">+</button>

    <span class="wallet-pill">
      <span class="wallet-pill__ico wallet-pill__ico--gem" data-icon="gem" aria-hidden="true"></span>
      <b data-gems>0</b>
    </span>
    <button class="plus" type="button" data-buy="gems" aria-label="Get more diamonds">+</button>

    <button class="bank" type="button" data-bank>
      <span data-icon="gift" aria-hidden="true"></span>
      <b>BANK</b>
    </button>
  </div>

  <a class="passcard" href="#/pass" data-route="pass" aria-label="Season pass progress">
    <span class="passcard__crown" data-icon="crown" aria-hidden="true"></span>
    <span class="passcard__text">
      <b>Free Pass</b>
      <span class="passcard__bar"><i data-pass-bar></i></span>
      <small data-pass-text>0 / 5</small>
    </span>
    <span class="passcard__badge" aria-hidden="true">!</span>
  </a>
</header>

<!-- ----------------------------------------------------------------- main -->
<main id="main" class="view" tabindex="-1">
  <div class="boot" role="status" aria-live="polite">
    <span class="boot__card"></span>
    <p>Shuffling the deck…</p>
  </div>
</main>

<!-- ------------------------------------------------------------- floaters -->
<div class="floaters">
  <button class="chatfab" type="button" data-chat aria-label="Table chat and news">
    <span data-icon="msg" aria-hidden="true"></span>
  </button>

  <div class="floaters__right">
    <button class="gg" type="button" data-sale>
      <span>GG</span>
      <b>SALE</b>
    </button>
    <button class="rewards" type="button" data-rewards>
      <span class="rewards__ico" data-icon="chest" aria-hidden="true"></span>
      <span class="rewards__label">FREE<br>REWARDS</span>
      <span class="rewards__dot" aria-hidden="true">!</span>
    </button>
  </div>
</div>

<!-- ----------------------------------------------------------------- dock -->
<nav class="dock" aria-label="Sections">
  <a class="dock__item" href="#/play/classic" data-route="play">
    <span class="dock__ico" data-icon="play" aria-hidden="true"></span>
    <span class="dock__label">Play</span>
  </a>
  <a class="dock__item" href="#/settings" data-route="settings">
    <span class="dock__ico" data-icon="gear" aria-hidden="true"></span>
    <span class="dock__label">Settings</span>
  </a>
  <a class="dock__item" href="#/social" data-route="social">
    <span class="dock__ico" data-icon="users" aria-hidden="true"></span>
    <span class="dock__label">Friends</span>
    <span class="dock__dot" aria-hidden="true">!</span>
  </a>
  <a class="dock__item" href="#/ranks" data-route="ranks">
    <span class="dock__ico" data-icon="trophy" aria-hidden="true"></span>
    <span class="dock__label">League</span>
  </a>
  <a class="dock__item" href="#/events" data-route="events">
    <span class="dock__ico" data-icon="calendar" aria-hidden="true"></span>
    <span class="dock__label">Events</span>
    <span class="dock__dot" aria-hidden="true">!</span>
  </a>
  <a class="dock__item" href="#/pass" data-route="pass">
    <span class="dock__ico" data-icon="sparkle" aria-hidden="true"></span>
    <span class="dock__label">Pass</span>
  </a>
  <button class="dock__item" type="button" data-rewards>
    <span class="dock__ico" data-icon="chest" aria-hidden="true"></span>
    <span class="dock__label">Free</span>
    <span class="dock__timer" data-daily-timer>10d 13h</span>
    <span class="dock__dot" aria-hidden="true">!</span>
  </button>
  <a class="dock__item" href="#/shop" data-route="shop">
    <span class="dock__ico" data-icon="bag" aria-hidden="true"></span>
    <span class="dock__label">Store</span>
  </a>
  <a class="dock__item" href="#/profile" data-route="profile">
    <span class="dock__ico" data-icon="user" aria-hidden="true"></span>
    <span class="dock__label">You</span>
  </a>
</nav>

<div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
<div id="dialog-root"></div>

<script type="module" src="assets/js/app.js?v=5.1"></script>
<noscript>
  <p class="noscript">Champ Word needs JavaScript for the lobby. The tables themselves stay playable at
    <a href="../game/">the classic client</a>.</p>
</noscript>
</body>
</html>
